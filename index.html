<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhyavey Wellness Group — Management Console v37</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root{
  --teal-950:#0d2b2b;--teal-900:#143838;--teal-800:#1a4a4a;--teal-700:#235e5e;--teal-600:#2f7575;
  --cream:#f7f3ec;--cream-dim:#efe9dd;--paper:#fffdf9;
  --gold:#c9a468;--gold-light:#e3cda0;
  --charcoal:#2b2b2b;--ink-soft:#5c5650;
  --sage:#7d9c87;--rose:#b9695f;
  --line:rgba(26,74,74,0.14);
  --shadow-soft:0 1px 2px rgba(13,43,43,0.06),0 8px 24px -8px rgba(13,43,43,0.12);
  --shadow-lift:0 4px 10px rgba(13,43,43,0.08),0 24px 48px -16px rgba(13,43,43,0.22);
  --radius:14px;--serif:'Cormorant Garamond',serif;--sans:'Inter',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--cream);color:var(--charcoal);-webkit-font-smoothing:antialiased;min-height:100vh;}
.app{display:none;min-height:100vh;}
.app.active{display:block;}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--teal-950);position:relative;overflow:hidden;}
#login-screen::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 800px 800px at 50% -10%,rgba(201,164,104,0.14),transparent 60%),radial-gradient(ellipse 600px 600px at 100% 100%,rgba(35,94,94,0.5),transparent 60%);}
.login-card{position:relative;z-index:1;width:min(440px,90vw);background:var(--paper);border-radius:20px;padding:48px 40px 36px;box-shadow:0 30px 80px -20px rgba(0,0,0,0.5);text-align:center;animation:riseIn .7s cubic-bezier(.16,1,.3,1) both;}
@keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.login-mark{width:54px;height:54px;margin:0 auto 18px;color:var(--teal-800);}
.login-mark svg{width:100%;height:100%;}
.login-mark-logo{width:200px;height:auto;}
.brand-name{font-family:var(--serif);font-weight:600;font-size:2.1rem;letter-spacing:0.04em;color:var(--teal-900);}
.brand-sub{font-size:0.68rem;letter-spacing:0.28em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-top:6px;}
.login-tagline{margin-top:18px;font-family:var(--serif);font-style:italic;font-size:1rem;color:var(--ink-soft);}
.login-form{margin-top:30px;text-align:left;display:flex;flex-direction:column;gap:16px;}
.role-toggle{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:4px;}
.role-toggle button{flex:1;border:none;background:var(--cream);padding:11px;font-size:.85rem;font-weight:700;cursor:pointer;color:var(--ink-soft);font-family:var(--sans);}
.role-toggle button.active{background:var(--teal-800);color:var(--cream);}
.field label{display:block;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:7px;}
.field select,.field input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);font-family:var(--sans);font-size:.95rem;background:var(--cream);color:var(--charcoal);}
.field select:focus,.field input:focus{outline:none;border-color:var(--teal-700);background:var(--paper);}
.btn{appearance:none;border:none;cursor:pointer;font-family:var(--sans);font-weight:700;font-size:.92rem;letter-spacing:.02em;border-radius:10px;padding:13px 20px;transition:transform .15s,box-shadow .15s,background .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
.btn-primary{background:var(--teal-800);color:var(--cream);margin-top:6px;}
.btn-primary:hover{background:var(--teal-700);box-shadow:var(--shadow-lift);transform:translateY(-1px);}
.btn-gold{background:var(--gold);color:var(--teal-950);}
.btn-gold:hover{background:var(--gold-light);transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--teal-800);border:1.5px solid var(--line);}
.btn-ghost:hover{background:var(--cream);}
.btn-danger{background:var(--rose);color:#fff;}
.btn-danger:hover{background:#a4564c;}
.login-hint{margin-top:18px;font-size:.78rem;color:#a39c8e;}
.login-error{margin-top:12px;font-size:.82rem;color:var(--rose);font-weight:600;min-height:1em;}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:50;background:var(--teal-900);color:var(--cream);display:flex;align-items:center;justify-content:space-between;padding:14px 28px;box-shadow:0 2px 16px rgba(0,0,0,0.18);}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-mark{width:30px;height:30px;color:var(--gold-light);}
.topbar-mark svg{width:100%;height:100%;}
.topbar-mark-logo{background:var(--cream);border-radius:50%;padding:4px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;}
.topbar-title{font-family:var(--serif);font-size:1.28rem;font-weight:600;letter-spacing:.02em;}
.topbar-title .sub{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-light);display:block;margin-top:-2px;font-family:var(--sans);font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:14px;font-size:.85rem;}
.outlet-switcher select{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:var(--cream);border-radius:100px;padding:8px 16px;font-size:.83rem;font-weight:600;font-family:var(--sans);}
.staff-pill{background:rgba(255,255,255,.08);border-radius:100px;padding:7px 16px;display:flex;align-items:center;gap:8px;}
.staff-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--sage);}
.logout-link{color:var(--cream);opacity:.75;cursor:pointer;font-weight:600;text-decoration:none;}
.logout-link:hover{opacity:1;text-decoration:underline;}

.tabs{display:flex;gap:4px;padding:0 28px;background:var(--teal-800);overflow-x:auto;}
.tab{padding:13px 18px;font-size:.85rem;font-weight:600;color:rgba(247,243,236,.65);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:.15s;}
.tab:hover{color:var(--cream);}
.tab.active{color:var(--cream);border-bottom-color:var(--gold);}

.shell{max-width:1360px;margin:0 auto;padding:32px 28px 80px;}
.view{display:none;}
.view.active{display:block;animation:fadeUp .4s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{margin-bottom:26px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;}
.page-head h1{font-family:var(--serif);font-size:2rem;font-weight:600;color:var(--teal-900);}
.page-head p{color:var(--ink-soft);font-size:.92rem;margin-top:4px;}

.panel{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow-soft);border:1px solid var(--line);}
.panel-pad{padding:26px 26px 24px;}
.panel-head{font-family:var(--serif);font-size:1.18rem;font-weight:600;color:var(--teal-900);display:flex;align-items:center;gap:8px;margin-bottom:18px;}
.panel-head .num{width:24px;height:24px;border-radius:50%;background:var(--teal-800);color:var(--cream);font-family:var(--sans);font-size:.7rem;font-weight:800;display:flex;align-items:center;justify-content:center;}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-grid .full{grid-column:1/-1;}
.field-sm label{display:block;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;}
.field-sm select,.field-sm input{width:100%;padding:10px 12px;border-radius:9px;border:1.5px solid var(--line);font-family:var(--sans);font-size:.9rem;background:var(--cream);color:var(--charcoal);}
.field-sm select:focus,.field-sm input:focus{outline:none;border-color:var(--teal-700);background:var(--paper);}
.therapy-price-hint{font-size:.74rem;color:var(--gold);font-weight:600;margin-top:5px;}
.divider-label{display:flex;align-items:center;gap:10px;margin:22px 0 14px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-700);}
.divider-label::after{content:'';flex:1;height:1px;background:var(--line);}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.pay-field{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--cream);}
.pay-field label{display:flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
.pay-field input{width:100%;border:none;background:transparent;font-size:1rem;font-weight:700;color:var(--teal-900);font-family:var(--sans);}

/* PRINT BILL */
#print-bill-area{display:none;}
.bill-receipt{width:100%;max-width:700px;margin:0 auto;font-family:'Inter',-apple-system,sans-serif;color:#1a1a1a;padding:20px 14px;font-size:18px;line-height:1.5;}
.bill-receipt .biz-name{font-weight:800;font-size:24px;text-align:center;text-transform:uppercase;letter-spacing:.02em;}
.bill-receipt .biz-addr{text-align:center;color:#555;font-size:16px;margin-top:6px;}
.bill-receipt .biz-phone{text-align:center;color:#555;font-size:16px;margin-top:3px;}
.bill-receipt .b-divider{border-top:1px dashed #999;margin:14px 0;}
.bill-receipt .disclaimer{font-size:12px;line-height:1.4;color:#555;text-align:center;margin-top:18px;padding:0 4px;}
.bill-receipt .sale-no{font-weight:700;font-size:19px;}
.bill-receipt .sale-date{color:#555;font-size:16px;margin-top:2px;}
.bill-receipt .sec-label{font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.03em;color:#333;margin-bottom:4px;}
.bill-receipt .client-name{font-weight:600;font-size:19px;}
.bill-receipt .client-phone{color:#555;font-size:17px;}
.bill-receipt .item-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:12px;}
.bill-receipt .item-row .item-name{font-weight:600;}
.bill-receipt .item-row .item-amt{font-weight:600;white-space:nowrap;}
.bill-receipt .item-sub{color:#666;font-size:16px;margin-top:2px;}
.bill-receipt .tot-row{display:flex;justify-content:space-between;font-size:18px;margin-top:7px;}
.bill-receipt .tot-row.grand{font-weight:800;font-size:20px;margin-top:10px;}
.bill-receipt .tot-row.neg{color:#a4564c;}
.bill-receipt .pay-row{display:flex;justify-content:space-between;font-size:18px;margin-top:8px;}
.bill-receipt .pay-date{color:#777;font-size:15px;margin-top:-2px;margin-bottom:3px;}
.bill-receipt .sig-row{display:flex;justify-content:space-between;margin-top:50px;}
.bill-receipt .sig-row div{width:46%;border-top:1px solid #333;text-align:center;padding-top:7px;font-size:14px;letter-spacing:.04em;color:#444;text-transform:uppercase;}
@page{ size:A4; margin:8mm; }
@media print{
  html,body{height:auto !important; margin:0 !important; padding:0 !important;}
  body *{visibility:hidden;}
  #print-bill-area,#print-bill-area *{visibility:visible;}
  #print-bill-area{display:block;position:absolute;top:0;left:0;width:100%;}
  .bill-receipt{max-width:100%;padding:6px 10px;font-size:14px;line-height:1.32;page-break-inside:avoid;}
  .bill-receipt .biz-name{font-size:18px;}
  .bill-receipt .biz-addr,.bill-receipt .biz-phone{font-size:12px;margin-top:3px;}
  .bill-receipt .b-divider{margin:8px 0;}
  .bill-receipt .sale-no{font-size:15px;}
  .bill-receipt .sale-date{font-size:12px;}
  .bill-receipt .sec-label{font-size:12px;margin-bottom:2px;}
  .bill-receipt .client-name{font-size:15px;}
  .bill-receipt .client-phone{font-size:13px;}
  .bill-receipt .item-row{margin-top:6px;}
  .bill-receipt .item-sub{font-size:12px;margin-top:1px;}
  .bill-receipt .tot-row{font-size:14px;margin-top:4px;}
  .bill-receipt .tot-row.grand{font-size:16px;margin-top:6px;}
  .bill-receipt .pay-row{font-size:14px;margin-top:4px;}
  .bill-receipt .pay-date{font-size:11px;}
  .bill-receipt .sig-row{margin-top:26px;}
  .bill-receipt .disclaimer{margin-top:10px;font-size:10px;}
}
.pay-field input:focus{outline:none;}
.discount-row{display:flex;gap:10px;align-items:flex-end;margin-top:14px;}
.discount-row .field-sm{flex:1;}
.discount-type{display:flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;}
.discount-type button{border:none;background:var(--cream);padding:10px 14px;font-size:.8rem;font-weight:700;cursor:pointer;color:var(--ink-soft);font-family:var(--sans);}
.discount-type button.active{background:var(--teal-800);color:var(--cream);}

.summary-strip{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:10px;margin-top:20px;}
.summary-strip .item{background:var(--cream);border-radius:10px;padding:12px 14px;}
.summary-strip .item.total{background:var(--teal-900);}
.summary-strip .item .lab{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);}
.summary-strip .item.total .lab{color:rgba(247,243,236,.7);}
.summary-strip .item .val{font-size:1.3rem;font-weight:800;color:var(--teal-900);font-family:var(--serif);margin-top:3px;}
.summary-strip .item.total .val{color:var(--gold-light);}
.submit-row{display:flex;gap:12px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap;}

.billing-grid{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start;}
.wa-wrap{position:sticky;top:80px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-soft);overflow:hidden;}
.wa-header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--teal-800);color:var(--cream);}
.wa-avatar{width:36px;height:36px;border-radius:50%;background:var(--teal-600);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;flex-shrink:0;}
.wa-header .name{font-weight:700;font-size:.9rem;}
.wa-header .status{font-size:.72rem;opacity:.65;margin-top:1px;}
.wa-bubble-wrap{padding:16px;background:#e5ddd5;min-height:200px;max-height:480px;overflow-y:auto;}
.wa-bubble{background:white;border-radius:8px 8px 8px 2px;padding:12px 14px;font-size:.8rem;line-height:1.7;white-space:pre-wrap;font-family:monospace;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.wa-time{text-align:right;font-size:.7rem;color:#8a9da0;margin-top:5px;}

.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.stat-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 16px;box-shadow:var(--shadow-soft);}
.stat-card.gold{background:var(--teal-900);}
.stat-card.rose .val{color:var(--rose);}
.stat-card .lab{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);}
.stat-card.gold .lab{color:rgba(247,243,236,.6);}
.stat-card .val{font-family:var(--serif);font-size:1.55rem;font-weight:700;color:var(--teal-900);margin-top:4px;}
.stat-card.gold .val{color:var(--gold-light);}

.day-controls{margin-bottom:20px;}
.entries-list{display:flex;flex-direction:column;gap:10px;}
.entry-row{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:14px 18px;display:grid;grid-template-columns:28px 1fr auto auto auto auto;gap:12px;align-items:center;box-shadow:var(--shadow-soft);}
.entry-row.entry-comp{border-left:3px solid var(--gold);}
.entry-row .seq{font-family:var(--serif);font-weight:700;font-size:1.1rem;color:var(--teal-800);}
.entry-row .who{font-weight:700;font-size:.95rem;color:var(--charcoal);}
.entry-row .meta{font-size:.78rem;color:var(--ink-soft);margin-top:2px;}
.entry-row .amt{font-weight:800;font-size:1.05rem;color:var(--teal-800);white-space:nowrap;}
.del{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:.75rem;font-weight:700;cursor:pointer;color:var(--ink-soft);font-family:var(--sans);}
.del:hover{background:var(--cream-dim);}
.comp-badge{background:var(--gold);color:var(--teal-950);font-size:.65rem;padding:2px 7px;border-radius:20px;font-weight:800;letter-spacing:.04em;vertical-align:middle;margin-left:4px;}

/* OUTLET GRID (owner home) */
.outlet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;}
.outlet-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px 20px;cursor:pointer;transition:transform .18s,box-shadow .18s;box-shadow:var(--shadow-soft);}
.outlet-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);}
.outlet-card .loc{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-600);margin-bottom:4px;}
.outlet-card .name{font-family:var(--serif);font-size:1.25rem;font-weight:600;color:var(--teal-900);margin-bottom:10px;}
.outlet-card .num{font-size:1.55rem;font-weight:800;color:var(--teal-800);font-family:var(--serif);}
.outlet-card .sub{font-size:.78rem;color:var(--ink-soft);margin-top:3px;}
.bar-track{background:var(--line);border-radius:4px;height:5px;margin-top:12px;overflow:hidden;}
.bar-fill{height:100%;background:var(--sage);border-radius:4px;transition:width .5s ease;}
.outlet-mini-stats{display:flex;gap:14px;margin-top:12px;font-size:.78rem;color:var(--ink-soft);}
.outlet-cta{margin-top:12px;font-size:.72rem;font-weight:700;color:var(--teal-700);letter-spacing:.04em;text-transform:uppercase;}
.group-progress-wrap{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:22px;box-shadow:var(--shadow-soft);}
.group-prog-label{display:flex;justify-content:space-between;font-size:.82rem;font-weight:600;color:var(--ink-soft);margin-bottom:10px;}

.final-grid{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start;}
.target-bar-track{background:var(--line);border-radius:6px;height:8px;overflow:hidden;margin:12px 0 6px;}
.target-bar-fill{height:100%;background:var(--sage);border-radius:6px;transition:width .5s ease;}
.target-bar-labels{display:flex;justify-content:space-between;font-size:.78rem;color:var(--ink-soft);font-weight:600;}

.chart-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow-soft);margin-bottom:20px;}
.recent-sales-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px 26px 20px;box-shadow:var(--shadow-soft);margin-bottom:20px;}
.recent-sales-card .rsc-top{display:flex;align-items:flex-start;justify-content:space-between;}
.recent-sales-card .rsc-title{font-family:var(--sans);font-size:1.15rem;font-weight:800;color:var(--charcoal);}
.recent-sales-card .rsc-sub{font-size:.82rem;color:var(--ink-soft);margin-top:2px;}
.recent-sales-card .rsc-menu{color:var(--ink-soft);font-weight:700;font-size:1.1rem;cursor:default;letter-spacing:1px;}
.recent-sales-card .rsc-total{font-family:var(--sans);font-size:2.4rem;font-weight:800;color:var(--charcoal);margin-top:14px;}
.recent-sales-card .rsc-stats{display:flex;gap:28px;margin-top:12px;flex-wrap:wrap;}
.recent-sales-card .rsc-stat{font-size:.86rem;color:var(--ink-soft);}
.recent-sales-card .rsc-stat b{color:var(--charcoal);font-weight:700;margin-left:5px;}
.recent-sales-card .rsc-legend{display:flex;gap:22px;margin-top:12px;padding-top:14px;border-top:1px solid var(--line);}
.recent-sales-card .rsc-legend span{display:flex;align-items:center;gap:7px;font-size:.84rem;color:var(--ink-soft);font-weight:600;}
.recent-sales-card .rsc-legend i{width:10px;height:10px;border-radius:50%;display:inline-block;}
.recent-sales-card .rsc-month-select{font-family:var(--sans);font-size:.82rem;font-weight:700;color:var(--charcoal);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;}
.chart-card .chart-title{font-family:var(--serif);font-size:1.1rem;font-weight:600;color:var(--teal-900);margin-bottom:14px;}
.chart-wrap{position:relative;height:280px;}
.leaderboard-row{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem;}
.leaderboard-row:last-child{border-bottom:none;}
.leaderboard-row .rank{font-family:var(--serif);font-weight:700;color:var(--gold);}
.leaderboard-row .amt{font-weight:800;color:var(--teal-800);}
.export-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
.pay-mode-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.pay-mode-card{border-radius:10px;padding:12px 14px;border:1.5px solid var(--line);background:var(--cream);}
.pay-mode-card .pm-icon{font-size:1.2rem;margin-bottom:4px;}
.pay-mode-card .pm-lab{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);}
.pay-mode-card .pm-val{font-family:var(--serif);font-size:1.15rem;font-weight:700;color:var(--teal-900);margin-top:2px;}
.pay-mode-card .pm-pct{font-size:.72rem;color:var(--gold);font-weight:700;margin-top:1px;}
.pay-mode-card.cash{border-color:rgba(125,156,135,0.4);background:rgba(125,156,135,0.07);}
.pay-mode-card.upi{border-color:rgba(47,117,117,0.35);background:rgba(47,117,117,0.06);}
.pay-mode-card.card{border-color:rgba(201,164,104,0.4);background:rgba(201,164,104,0.07);}
.pay-mode-card.roompost{border-color:rgba(185,105,95,0.35);background:rgba(185,105,95,0.06);}
.exp-mode-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px;}
.exp-mode-card{border-radius:10px;padding:10px 12px;border:1.5px solid var(--line);background:var(--cream);display:flex;align-items:center;justify-content:space-between;}
.exp-mode-card .em-lab{font-size:.78rem;font-weight:600;color:var(--ink-soft);}
.exp-mode-card .em-val{font-weight:800;font-size:.95rem;color:var(--teal-900);}
@media(max-width:640px){.pay-mode-cards{grid-template-columns:repeat(2,1fr);}.exp-mode-cards{grid-template-columns:1fr;}}

.settings-card{max-width:720px;}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);gap:12px;}
.settings-row:last-child{border-bottom:none;}
.settings-row .lab{font-weight:600;font-size:.92rem;color:var(--teal-900);}
.settings-row .desc{font-size:.78rem;color:var(--ink-soft);margin-top:2px;}
table.menu-table{width:100%;border-collapse:collapse;font-size:.86rem;}
table.menu-table th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);padding:8px 6px;border-bottom:1px solid var(--line);}
table.menu-table td{padding:8px 6px;border-bottom:1px solid var(--line);}
table.menu-table input{width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--line);font-size:.85rem;background:var(--cream);}

/* APPOINTMENTS */
.appt-subtabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:0;}
.appt-subtab{padding:10px 2px 12px;font-size:.92rem;font-weight:700;color:var(--ink-soft);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px;}
.appt-subtab:hover{color:var(--teal-800);}
.appt-subtab.active{color:var(--teal-800);border-bottom-color:var(--teal-800);}
.appt-customdate-bar{display:flex;align-items:center;gap:10px;padding:14px 0 4px;}
.appt-customdate-bar input[type=date]{padding:9px 12px;border-radius:9px;border:1.5px solid var(--line);font-family:var(--sans);font-size:.88rem;background:var(--paper);}
.appt-table-wrap{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow-soft);border:1px solid var(--line);overflow:hidden;margin-top:18px;}
.appt-head-row{display:grid;grid-template-columns:1.55fr 1.9fr 1.3fr 1.4fr 1fr 0.5fr;gap:10px;padding:13px 22px;font-size:.68rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--line);}
.appt-date-band{display:flex;align-items:center;gap:9px;padding:13px 22px;background:var(--cream-dim);font-family:var(--serif);font-weight:700;font-size:1.05rem;color:var(--teal-900);border-bottom:1px solid var(--line);}
.appt-date-band svg{width:16px;height:16px;flex-shrink:0;color:var(--teal-700);}
.appt-row{display:grid;grid-template-columns:1.55fr 1.9fr 1.3fr 1.4fr 1fr 0.5fr;gap:10px;align-items:center;padding:15px 22px;border-bottom:1px solid var(--line);font-size:.92rem;}
.appt-row:last-child{border-bottom:none;}
.appt-time{display:flex;align-items:center;gap:8px;color:var(--charcoal);font-weight:600;}
.appt-time svg{width:15px;height:15px;color:var(--ink-soft);flex-shrink:0;}
.appt-eventtype{display:flex;align-items:center;gap:9px;}
.appt-badge{font-size:.66rem;font-weight:800;letter-spacing:.02em;padding:4px 7px;border-radius:6px;color:#fff;flex-shrink:0;}
.appt-customer{display:flex;align-items:center;gap:7px;color:var(--charcoal);font-weight:600;}
.appt-customer svg{width:14px;height:14px;color:var(--ink-soft);flex-shrink:0;}
.appt-contact{color:var(--ink-soft);font-size:.87rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.appt-delete-btn{background:none;border:none;cursor:pointer;color:var(--ink-soft);padding:6px;border-radius:7px;display:flex;align-items:center;justify-content:center;}
.appt-delete-btn:hover{background:#fbeaea;color:var(--rose);}
.appt-delete-btn svg{width:16px;height:16px;}
.appt-status-wrap{position:relative;display:inline-block;}
.appt-status-select{appearance:none;-webkit-appearance:none;font-family:var(--sans);font-weight:700;font-size:.82rem;border-radius:8px;padding:7px 30px 7px 12px;border:1.5px solid;cursor:pointer;background-repeat:no-repeat;background-position:right 10px center;background-size:11px;}
.appt-status-select.st-upcoming{background-color:#eaf1fb;border-color:#bcd6f5;color:#2f6fb0;}
.appt-status-select.st-completed{background-color:#eaf7ee;border-color:#bfe3c9;color:#2e8b4f;}
.appt-status-select.st-cancelled{background-color:#fbeaea;border-color:#f0c2c2;color:#b9433a;}
.appt-status-select.st-noshow{background-color:#f5f0e6;border-color:#e3d5b6;color:#96772e;}
.appt-empty{padding:48px 22px;text-align:center;color:var(--ink-soft);font-size:.92rem;}
.appt-empty svg{width:34px;height:34px;color:var(--line);margin-bottom:10px;}

/* Appointment modal */
.appt-modal-overlay{display:none;position:fixed;inset:0;background:rgba(13,43,43,0.45);z-index:200;align-items:center;justify-content:center;padding:20px;}
.appt-modal-overlay.show{display:flex;}
.appt-modal{background:var(--paper);border-radius:16px;width:min(560px,100%);max-height:88vh;overflow-y:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);animation:riseIn .35s cubic-bezier(.16,1,.3,1) both;}
.appt-modal-head{display:flex;align-items:center;justify-content:space-between;padding:22px 26px 16px;border-bottom:1px solid var(--line);}
.appt-modal-head h2{font-family:var(--serif);font-size:1.35rem;font-weight:600;color:var(--teal-900);}
.appt-modal-close{background:none;border:none;font-size:1.3rem;line-height:1;color:var(--ink-soft);cursor:pointer;padding:4px 6px;}
.appt-modal-close:hover{color:var(--charcoal);}
.appt-modal-body{padding:22px 26px 8px;}
.appt-modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:18px 26px 24px;}

.empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:.95rem;}

/* MEMBERSHIP */
.mship-tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
.mship-tabs button{appearance:none;border:1.5px solid var(--line);background:var(--paper);color:var(--ink-soft);font-family:var(--sans);font-weight:700;font-size:.85rem;padding:9px 18px;border-radius:100px;cursor:pointer;transition:.15s;}
.mship-tabs button.active{background:var(--teal-800);color:var(--cream);border-color:var(--teal-800);}
.plan-pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px;}
.plan-pick{border:1.5px solid var(--line);border-radius:12px;padding:14px 12px;cursor:pointer;text-align:center;background:var(--cream);transition:.15s;}
.plan-pick:hover{border-color:var(--gold);}
.plan-pick.active{background:var(--teal-800);border-color:var(--teal-800);}
.plan-pick.active *{color:var(--cream)!important;}
.plan-pick .tier{font-family:var(--serif);font-weight:700;font-size:1.05rem;color:var(--teal-900);}
.plan-pick .amt{font-size:1.2rem;font-weight:800;color:var(--gold);margin:4px 0;}
.plan-pick .meta{font-size:.72rem;color:var(--ink-soft);}
.search-row{display:flex;gap:10px;margin-bottom:18px;}
.search-row input{flex:1;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);font-family:var(--sans);font-size:.92rem;background:var(--cream);}
.search-row input:focus{outline:none;border-color:var(--teal-700);background:var(--paper);}
.member-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-soft);padding:20px 22px;margin-bottom:16px;}
.member-card-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
.member-code{font-family:var(--sans);font-weight:800;letter-spacing:.04em;color:var(--gold);font-size:.78rem;background:var(--teal-950);padding:4px 10px;border-radius:6px;display:inline-block;margin-bottom:6px;}
.member-name{font-family:var(--serif);font-size:1.3rem;font-weight:700;color:var(--teal-900);}
.member-meta{font-size:.78rem;color:var(--ink-soft);margin-top:2px;}
.mship-badge{font-size:.65rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:20px;}
.mship-badge.active{background:rgba(125,156,135,.18);color:var(--sage);}
.mship-badge.expired{background:rgba(185,105,95,.15);color:var(--rose);}
.mship-badge.exhausted{background:rgba(185,105,95,.15);color:var(--rose);}
.mship-badge.cancelled{background:rgba(92,86,80,.12);color:var(--ink-soft);}
.mship-badge.paused{background:rgba(201,164,104,.18);color:var(--gold);}
.member-progress-wrap{margin:14px 0 10px;}
.member-progress-label{display:flex;justify-content:space-between;font-size:.8rem;font-weight:600;color:var(--teal-900);margin-bottom:6px;}
.member-stats-row{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px;font-size:.8rem;color:var(--ink-soft);}
.member-stats-row b{color:var(--teal-900);font-weight:700;}
.redeem-history{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;}
.redeem-history-row{display:flex;justify-content:space-between;font-size:.8rem;padding:6px 0;border-bottom:1px solid var(--line);color:var(--ink-soft);}
.redeem-history-row:last-child{border-bottom:none;}
.member-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
.view-only-pill{background:rgba(201,164,104,.16);color:var(--gold);font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:.03em;}


.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--teal-950);color:var(--cream);padding:13px 24px;border-radius:100px;font-size:.88rem;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.3);opacity:0;transition:all .3s ease;pointer-events:none;z-index:200;display:flex;align-items:center;gap:8px;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast .tick{color:var(--sage);font-weight:800;}

@media(max-width:900px){.billing-grid,.final-grid{grid-template-columns:1fr;}.wa-wrap{position:static;}}
@media(max-width:640px){.form-grid,.pay-grid{grid-template-columns:1fr;}.summary-strip{grid-template-columns:1fr;gap:8px;}.stat-cards{grid-template-columns:1fr 1fr;}.topbar{padding:12px 16px;flex-wrap:wrap;gap:8px;}.shell{padding:22px 14px 60px;}.outlet-grid{grid-template-columns:1fr;}.entry-row{grid-template-columns:24px 1fr;grid-template-areas:"seq who" "amt amt" "del del";}}
</style>

function mergeCustomerProfiles(localP, remoteP){
  const out = {};
  const keys = new Set([...Object.keys(localP||{}), ...Object.keys(remoteP||{})]);
  keys.forEach(k=>{
    const l=(localP||{})[k], r=(remoteP||{})[k];
    if(l&&r) out[k] = (r.updatedAt||0) >= (l.updatedAt||0) ? r : l;
    else out[k] = l||r;
  });
  return out;
}
function mergeRemoteDB(local, remote){
  // Merge deletedIds from both sides first — union of all deletions
  const allDeletedIds = new Set([...(local.deletedIds||[]), ...(remote.deletedIds||[])]);

  // Smart merge: union by id, but NEVER restore deliberately deleted records
  function mergeById(localArr, remoteArr){
    const map = {};
    (localArr||[]).forEach(x=>{ if(x&&x.id && !allDeletedIds.has(x.id)) map[x.id]=x; });
    (remoteArr||[]).forEach(x=>{ if(x&&x.id && !allDeletedIds.has(x.id)) map[x.id]=x; });
    return Object.values(map);
  }
  // Union two "sub-record" arrays (redemptions, payments) that live INSIDE a
  // membership record, deduping by createdAt. Whole-object replace on the
  // parent membership used to silently drop whichever side's redemption/
  // payment hadn't reached the cloud yet — this keeps both.
  function mergeSubArray(localArr, remoteArr){
    const map = {};
    (localArr||[]).forEach(x=>{ if(x) map[x.createdAt??JSON.stringify(x)]=x; });
    (remoteArr||[]).forEach(x=>{ if(x) map[x.createdAt??JSON.stringify(x)]=x; });
    return Object.values(map).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  }
  function mergeMemberships(localArr, remoteArr){
    const localMap={}; (localArr||[]).forEach(x=>{ if(x&&x.id) localMap[x.id]=x; });
    const remoteMap={}; (remoteArr||[]).forEach(x=>{ if(x&&x.id) remoteMap[x.id]=x; });
    const ids=new Set([...Object.keys(localMap),...Object.keys(remoteMap)]);
    const out=[];
    ids.forEach(id=>{
      if(allDeletedIds.has(id)) return;
      const l=localMap[id], r=remoteMap[id];
      if(l&&r){
        out.push(Object.assign({}, r, l, {
          redemptions: mergeSubArray(l.redemptions, r.redemptions),
          payments:    mergeSubArray(l.payments,    r.payments),
        }));
      } else {
        out.push(l||r);
      }
    });
    return out;
  }
  // Pick whichever PIN was changed more recently; if only one side has a
  // timestamp (older data), trust the one that has it, else fall back to remote.
  function mergePin(localPin, localAt, remotePin, remoteAt){
    localAt=localAt||0; remoteAt=remoteAt||0;
    if(localAt>remoteAt) return {pin:localPin, at:localAt};
    return {pin:remotePin, at:remoteAt};
  }
  const ownerPinPick = mergePin(local.ownerPin, local.ownerPinUpdatedAt, remote.ownerPin, remote.ownerPinUpdatedAt);
  const mergedManagers = (()=>{
    const out = {};
    const ids = new Set([...Object.keys(local.managers||{}), ...Object.keys(remote.managers||{})]);
    ids.forEach(id=>{
      const l=(local.managers||{})[id], r=(remote.managers||{})[id];
      if(l&&r){
        const pinPick = mergePin(l.pin, l.pinUpdatedAt, r.pin, r.pinUpdatedAt);
        out[id] = { pin: pinPick.pin, pinUpdatedAt: pinPick.at, names: Array.from(new Set([...(l.names||[]), ...(r.names||[])])) };
      } else out[id] = l||r;
    });
    return out;
  })();
  return Object.assign(defaultDB(), remote, {
    deletedIds:    [...allDeletedIds],
    entries:       mergeById(local.entries,     remote.entries),
    appointments:  mergeById(local.appointments,remote.appointments),
    expenses:      mergeById(local.expenses,    remote.expenses),
    memberships:   mergeMemberships(local.memberships, remote.memberships),
    customerProfiles: mergeCustomerProfiles(local.customerProfiles, remote.customerProfiles),
    smsLog:        mergeById(local.smsLog, remote.smsLog).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,500),
    // For sequence numbers, always take the higher value
    membershipSeq: Math.max(local.membershipSeq||0, remote.membershipSeq||0),
    ownerPin:      ownerPinPick.pin,
    ownerPinUpdatedAt: ownerPinPick.at,
    // For settings/config prefer remote (owner controls these), except PINs
    // which are merged by recency above so a just-changed PIN never reverts.
    managers:      mergedManagers,
    therapists:    Object.assign({}, local.therapists,     remote.therapists||{}),
    monthlyTargets:Object.assign({}, local.monthlyTargets, remote.monthlyTargets||{}),
    whatsappGroups:Object.assign({}, local.whatsappGroups, remote.whatsappGroups||{}),
    menuOverrides: Object.assign({}, local.menuOverrides,  remote.menuOverrides||{}),
    smsConfig:     Object.assign({}, local.smsConfig,      remote.smsConfig||{}, {
                     templates: Object.assign({}, (local.smsConfig||{}).templates, ((remote.smsConfig)||{}).templates||{})
                   }),
    emailConfig:   Object.assign({}, local.emailConfig,    remote.emailConfig||{}),
    leaves:        (()=>{
      const out={};
      const keys=new Set([...Object.keys(local.leaves||{}), ...Object.keys(remote.leaves||{})]);
      keys.forEach(k=>{ out[k]=mergeById((local.leaves||{})[k], (remote.leaves||{})[k]); });
      return out;
    })(),
  });
}

function attachCloudListener(){
  fsDocRef.onSnapshot(snap=>{
    if(!snap.exists) return;
    // Ignore the echo of our own pending local write
    if(snap.metadata.hasPendingWrites){ cloudSyncStatus='synced'; updateSyncIndicator(); return; }
    const data = snap.data();
    if(!data || !data.json) return;
    if(data.json === lastPushedJSON){ cloudSyncStatus='synced'; updateSyncIndicator(); return; }
    // Remote change from another outlet/owner — SMART MERGE so no entries are lost
    try{
      const remote = JSON.parse(data.json);
      const merged = mergeRemoteDB(DB, remote);
      DB = merged;
      repairPaymentMismatches(); // re-heal in case the incoming remote copy brought back an old mismatched entry
      const mergedJSON = JSON.stringify(merged);
      localStorage.setItem(DB_KEY, mergedJSON);
      lastPushedJSON = mergedJSON;
      // Push merged result back to cloud ONLY if local had extra data remote didn't have
      const remoteEntryCount=(remote.entries||[]).length+(remote.memberships||[]).length+(remote.expenses||[]).length;
      const mergedEntryCount=(merged.entries||[]).length+(merged.memberships||[]).length+(merged.expenses||[]).length;
      if(cloudSyncReady && fsDocRef && mergedEntryCount > remoteEntryCount){
        fsDocRef.set({ json: mergedJSON, updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
          .catch(()=>{});
      }
      cloudSyncStatus='synced'; updateSyncIndicator();
      if(typeof session!=='undefined' && session && typeof renderAll==='function'){
        triggerSyncRender();
      }
    }catch(e){ console.error('Merge error:', e); }
  }, err=>{
    cloudSyncStatus='offline'; updateSyncIndicator();
  });
}

// Tabs where the user is typically mid-way through filling a multi-field form
// that isn't backed by billingState/DB until submitted (guest name, room no,
// therapy, duration, price, discount, membership-sale panel, etc). A full
// renderAll() rebuilds these forms from scratch via innerHTML, so re-rendering
// them the instant a background sync lands — even for a single blink between
// keystrokes when no field happens to be focused — silently erases everything
// the user has typed so far. So for these tabs we ALWAYS defer, regardless of
// focus state, and only catch up once the user leaves the field/tab or submits.
const SYNC_SENSITIVE_TABS = new Set(['billing','appointments']);
function triggerSyncRender(){
  if(SYNC_SENSITIVE_TABS.has(currentTab)){
    pendingSyncRender = true;
    return;
  }
  // Don't wipe out whatever the user is actively doing anywhere in the app —
  // a background sync used to force a full re-render mid-click/mid-type on ANY
  // tab (not just the billing guest field), which destroyed the DOM node under
  // the user's cursor and made the next click look like it "didn't register".
  const activeEl=document.activeElement;
  const userIsTyping = activeEl && /^(INPUT|TEXTAREA|SELECT)$/.test(activeEl.tagName);
  if(userIsTyping){
    // Silently keep DB updated; catch up the view once the user is done.
    pendingSyncRender = true;
  } else {
    renderAll();
  }
}

function pushToCloud(db){
  if(!cloudSyncReady || !fsDocRef) return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(()=>{
    // FIX (v37): pushes used to blindly .set() this device's local DB over the
    // shared cloud document with no read-before-write. When two outlets billed
    // within the same ~second, whichever push landed on the server SECOND
    // completely erased the entries the other outlet had just added (because
    // that device's local copy never had them yet) — this is why entries from
    // other outlets could silently vanish / never show up live. Fix: run every
    // push inside a Firestore transaction that reads the current server copy
    // first and merges it in (via the existing mergeRemoteDB union logic)
    // before writing, so a push can never erase data it hasn't seen yet.
    const fsdb = firebase.firestore();
    fsdb.runTransaction(tx=>{
      return tx.get(fsDocRef).then(snap=>{
        let toWrite = db, remoteHadExtra = false;
        if(snap.exists){
          const data = snap.data();
          if(data && data.json){
            try{
              const remote = JSON.parse(data.json);
              const merged = mergeRemoteDB(db, remote);
              const remoteCount=(remote.entries||[]).length+(remote.memberships||[]).length+(remote.expenses||[]).length;
              const localCount=(db.entries||[]).length+(db.memberships||[]).length+(db.expenses||[]).length;
              toWrite = merged;
              remoteHadExtra = remoteCount>localCount; // remote had entries this device didn't have locally
            }catch(e){ /* remote json unreadable — fall back to writing local as-is */ }
          }
        }
        const json = JSON.stringify(toWrite);
        tx.set(fsDocRef, { json, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        return { json, toWrite, remoteHadExtra };
      });
    }).then(({json, toWrite, remoteHadExtra})=>{
      lastPushedJSON = json;
      if(remoteHadExtra){
        // The server had entries (from another outlet) this device didn't have
        // locally — adopt the merged result locally too, and refresh the view.
        DB = toWrite;
        _localSaveDB(DB);
        if(typeof session!=='undefined' && session && typeof renderAll==='function'){
          triggerSyncRender();
        }
      }
      cloudSyncStatus='synced'; updateSyncIndicator();
    }).catch(()=>{ cloudSyncStatus='offline'; updateSyncIndicator(); });
  }, 500); // debounce rapid successive saves
}

// Wrap saveDB so every existing saveDB(DB) call site also syncs to the cloud
const _localSaveDB = saveDB;
saveDB = function(db){
  _localSaveDB(db);
  pushToCloud(db);
};

/* Builds the request for the configured provider and fires it.
   NOTE: this calls the SMS gateway directly from the browser using the
   API key saved in Settings. That is fine for an internal single-staff
   console, but it does expose the key in the page source — for a public
   or multi-user deployment, route this through a small backend instead. */
async function sendClientSMS(contact, message, meta){
  const cfg=DB.smsConfig||{};
  const mobile=normalizeMobile(contact);
  const logBase={id:'sms_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),contact,mobile,message,type:meta?.type||'generic',outletId:meta?.outletId||null,date:todayISO(),createdAt:Date.now()};
  if(!cfg.enabled){ logSms({...logBase,status:'skipped',note:'SMS notifications disabled in Settings'}); return {ok:false,reason:'disabled'}; }
  if(!mobile||mobile.length!==10){ logSms({...logBase,status:'failed',note:'Invalid/missing mobile number'}); return {ok:false,reason:'bad_number'}; }
  if(!cfg.apiKey && cfg.provider!=='custom'){ logSms({...logBase,status:'failed',note:'No SMS API key configured'}); return {ok:false,reason:'no_key'}; }
  try{
    let url='', opts={method:'GET'};
    if(cfg.provider==='fast2sms'){
      url=`https://www.fast2sms.com/dev/bulkV2?authorization=${encodeURIComponent(cfg.apiKey)}&route=${encodeURIComponent(cfg.route||'q')}&message=${encodeURIComponent(message)}&flash=0&numbers=${mobile}`;
    } else if(cfg.provider==='msg91'){
      url=`https://control.msg91.com/api/v5/flow/`;
      opts={method:'POST',headers:{'Content-Type':'application/json','authkey':cfg.apiKey},
        body:JSON.stringify({sender:cfg.senderId||'',mobiles:'91'+mobile,short_url:'0',template_id:'',message})};
      // MSG91 typically needs a DLT template_id for transactional SMS; if you use plain message-based
      // sending instead, swap this for MSG91's SendSMS API per your account's documentation.
    } else if(cfg.provider==='custom' && cfg.customUrlTemplate){
      url=cfg.customUrlTemplate.replace('{{contact}}',mobile).replace('{{message}}',encodeURIComponent(message)).replace('{{apiKey}}',encodeURIComponent(cfg.apiKey||''));
    } else {
      logSms({...logBase,status:'failed',note:'No provider configured'}); return {ok:false,reason:'no_provider'};
    }
    const res=await fetch(url,opts);
    const ok=res.ok;
    let body=''; try{body=await res.text();}catch(e){}
    logSms({...logBase,status:ok?'sent':'failed',note:body?body.slice(0,200):(ok?'':'HTTP '+res.status)});
    return {ok};
  }catch(err){
    // Most browsers will throw here if the gateway blocks cross-origin requests (CORS).
    // If every send fails with a network error, the provider likely needs a backend relay.
    logSms({...logBase,status:'failed',note:'Network/CORS error: '+(err.message||err)});
    return {ok:false,reason:'network'};
  }
}

function logEmail(entry){

async function sendOwnerLoginEmail(managerName, outletId){
  const cfg=DB.emailConfig||{};
  const outletName=(OUTLETS.find(o=>o.id===outletId)||{}).name||outletId;
  const loginTime=new Date().toLocaleString();
  const logBase={id:'em_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),managerName,outletId,outletName,loginTime,createdAt:Date.now()};
  if(!cfg.enabled){ logEmail({...logBase,status:'skipped',note:'Owner login alerts disabled in Settings'}); return {ok:false,reason:'disabled'}; }
  if(!cfg.ownerEmail){ logEmail({...logBase,status:'failed',note:'No owner email address configured'}); return {ok:false,reason:'no_email'}; }
  if(!cfg.serviceId||!cfg.templateId||!cfg.publicKey){ logEmail({...logBase,status:'failed',note:'EmailJS Service ID / Template ID / Public Key not fully configured'}); return {ok:false,reason:'no_config'}; }
  if(!window.emailjs){ logEmail({...logBase,status:'failed',note:'EmailJS SDK failed to load (check network/CDN access)'}); return {ok:false,reason:'sdk_missing'}; }
  try{
    await window.emailjs.send(cfg.serviceId, cfg.templateId, {
      to_email: cfg.ownerEmail,
      manager_name: managerName,
      outlet_name: outletName,
      login_time: loginTime,
    }, { publicKey: cfg.publicKey });

  }catch(err){

}

   every N days (cfg.reminderDaysGap) while they still have unused therapies
   and the membership is active and not expired. */

  const cfg=DB.smsConfig||{};
  if(!cfg.enabled) return;
  const gapMs=(cfg.reminderDaysGap||7)*86400000;
  const now=Date.now();
  (DB.memberships||[]).forEach(m=>{
    if(!m.contact) return;
    if(membershipStatus(m)!=='active') return;
    const remaining=membershipRemaining(m);
    if(remaining<=0) return;
    const last=m.lastReminderAt||0;
    if(now-last < gapMs) return;
    const vars={guest:m.guest, tier:m.tier, code:m.code, remaining, expiry:m.expiryDate, ...smsBrandVars(m.soldAtOutlet)};
    const msg=fillSmsTemplate(cfg.templates?.reminder, vars);

  if(m.status==='paused') return 'paused';

function calcEntry(price,discountType,discVal){
  price=Number(price)||0; discVal=Number(discVal)||0;
  let discountAmount=discountType==='pct'?price*(discVal/100):discVal;
  if(discountAmount>price)discountAmount=price;
  const beforeGst=Math.max(price-discountAmount,0);
  const gst=beforeGst*GST_RATE;
  return{price,discountAmount,beforeGst,gst,totalAfterDiscount:beforeGst+gst};
}

<script>/* ============================================================
   DHYAVEY WELLNESS GROUP — App Logic  v2
   ============================================================ */
let DB = loadDB();

/* ─── SELF-HEALING GUARD: repair payment-mode mismatches ──────────
   A regular (non-membership) sale should always have Cash+Online+Card+
   Room Post add up to the exact billed Total. This runs on EVERY load
   (not just once) and silently tops up whichever payment mode already
   has money in it (or Cash if none) so the sum always matches the Total.
   Running every time — instead of gating on a one-time flag — protects
   against stale browser caches, multi-device Firestore sync races, or
   any future save path that slips through. Membership purchases,
   redemptions, and due-payments are intentionally skipped since those
   support genuine partial payments tracked via a separate Due/Balance. */
function repairPaymentMismatches(){
  let fixedCount = 0;
  const fixedLog = [];
  (DB.entries||[]).forEach(e=>{
    if(e.membershipId) return; // purchases/redemptions/due-payments allow partial payment by design
    const total = Math.round(e.finalAmount||0);
    if(total<=0) return;
    const cash=e.cash||0, online=e.online||0, card=e.card||0, roompost=e.roompost||0;
    const paid = Math.round(cash+online+card+roompost);
    if(paid===total) return;
    const diff = total-paid;
    const modes=['cash','online','card','roompost'];
    let target='cash', max=-1;
    modes.forEach(m=>{ if((e[m]||0)>max){ max=e[m]||0; target=m; } });
    e[target]=Math.max(0,Math.round((e[target]||0)+diff));
    fixedCount++;
    fixedLog.push(`Sale ${e.billNo||e.id}: ${target} adjusted by ${diff>=0?'+':''}${diff} → now matches Total ₹${total}`);
  });
  if(fixedCount>0){
    saveDB(DB);
    console.info(`[Dhyavey] Repaired ${fixedCount} bill(s) with mismatched payment totals:\n`+fixedLog.join('\n'));
    setTimeout(()=>showToast(`Fixed ${fixedCount} bill(s) where payment didn't match total`),300);
  }
}
repairPaymentMismatches();

initCloudSync();

/* ─── PERMANENT INTEGRITY GUARD ───────────────────────────────
   Runs once on every page load. Checks that all critical functions
   and DOM elements exist. If anything is missing (e.g. a half-applied
   update from uploading an older file), it shows a clear error instead
   of silently misbehaving. This is the permanent fix for version drift.
   ─────────────────────────────────────────────────────────────── */
function integrityCheck(){
  // NOTE: deliberately runs on DOMContentLoaded (see listener below), not
  // immediately — several required functions/elements below live in later
  // <script> tags that haven't executed yet if this runs eagerly, which
  // previously caused permanent false-positive "integrity error" screens.
  const REQUIRED_FUNCTIONS = [
    'saveDB','loadDB','defaultDB','renderAll','renderBilling','renderToday',
    'renderMemberships','renderCustomers','renderExpenses','renderFinal',
    'renderAnalytics','renderSettings','renderOwnerHome','exportToExcel',
    'exportExpensesToExcel','exportCustomersToExcel','initCloudSync',
    'pushToCloud','mergeRemoteDB','membershipStatus','membershipRemaining',
    'dhvConfirm','showToast','buildReportText','buildMemberReportText'
  ];
  const REQUIRED_DOM = [
    'login-screen','app','toast','dhv-confirm-overlay',
    'dhv-confirm-ok','dhv-confirm-cancel','dhv-confirm-msg'
  ];
  const missingFns  = REQUIRED_FUNCTIONS.filter(f => typeof window[f] !== 'function');
  const missingEls  = REQUIRED_DOM.filter(id => !document.getElementById(id));
  if(missingFns.length || missingEls.length){
    const lines = [];
    if(missingFns.length) lines.push('Missing functions: ' + missingFns.join(', '));
    if(missingEls.length) lines.push('Missing DOM elements: ' + missingEls.join(', '));
    // Show a visible error so the problem is obvious immediately
    const err = document.createElement('div');
    err.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#1a0000;color:#ff8080;font-family:monospace;font-size:14px;padding:32px;overflow:auto;';
    err.innerHTML = `<b style="font-size:18px;color:#ff4444;">⚠ Dhyavey App — Version Integrity Error (v37)</b><br><br>
This file is missing critical parts, likely because an older version was re-uploaded<br>
overwriting fixes. Always use the file provided by Claude as the base for updates.<br><br>
${lines.map(l=>'• '+l).join('<br>')}<br><br>
<b>Fix:</b> Re-upload the latest file from Claude to Netlify.`;
    document.body.appendChild(err);
    console.error('[Dhyavey v37] Integrity check failed:', lines);
  } else {
    console.info('[Dhyavey v37] Integrity check passed ✓');
  }
}
document.addEventListener('DOMContentLoaded', integrityCheck);
// Apply any saved membership plan overrides from DB

let session = null; // { role:'owner'|'manager', name, outletId }
// Set true when a background cloud sync arrives while the user has a field
// focused, so the re-render is deferred instead of yanking the DOM out from
// under an active click/keystroke. Caught up as soon as focus leaves the field.
let pendingSyncRender = false;
document.addEventListener('focusout', e=>{
  if(!pendingSyncRender) return;
  const next = e.relatedTarget;
  const stillTyping = next && /^(INPUT|TEXTAREA|SELECT)$/.test(next.tagName);
  if(stillTyping) return;
  setTimeout(()=>{
    if(pendingSyncRender && typeof renderAll==='function' && session){
      pendingSyncRender=false; renderAll();
    }
  },150);
}, true);
let ownerViewingOutlet = null; // null = group overview; outletId = drilled-in
let currentTab = 'home';

/* ─── LOGIN ─── */
let loginRole = 'owner';
function populateOutletSelect(sel){
  sel.innerHTML = OUTLETS.map(o=>`<option value="${o.id}">${o.name}</option>`).join('');
}
function refreshLoginForm(){
  document.getElementById('role-owner-btn').classList.toggle('active',loginRole==='owner');
  document.getElementById('role-manager-btn').classList.toggle('active',loginRole==='manager');
  document.getElementById('manager-outlet-field').style.display=loginRole==='manager'?'block':'none';
  document.getElementById('login-name-label').textContent=loginRole==='owner'?'Owner Name':'Your Name';
  const sel=document.getElementById('login-staff');
  const ni=document.getElementById('login-staff-new');
  if(loginRole==='owner'){
    sel.innerHTML=DB.owners.map(o=>`<option value="${o}">${o}</option>`).join('');
    ni.style.display='block';
  }else{
    const outletId=document.getElementById('login-outlet').value||OUTLETS[0].id;
    const names=(DB.managers[outletId]||{names:[]}).names;
    sel.innerHTML=names.map(n=>`<option value="${n}">${n}</option>`).join('');
    ni.style.display='block';
  }
}
document.getElementById('role-owner-btn').addEventListener('click',()=>{loginRole='owner';refreshLoginForm();});
document.getElementById('role-manager-btn').addEventListener('click',()=>{loginRole='manager';refreshLoginForm();});
document.getElementById('login-outlet').addEventListener('change',refreshLoginForm);

document.getElementById('login-form').addEventListener('submit',e=>{
  e.preventDefault();
  const err=document.getElementById('login-error');
  const pin=document.getElementById('login-pin').value;
  const typed=document.getElementById('login-staff-new').value.trim();
  const sel=document.getElementById('login-staff').value;
  const name=typed||sel;
  if(!name){err.textContent="Please select or type your name.";return;}
  if(loginRole==='owner'){
    if(pin!==DB.ownerPin){err.textContent="Incorrect owner PIN.";return;}
    if(typed&&!DB.owners.includes(typed)){DB.owners.push(typed);saveDB(DB);}
    session={role:'owner',name};ownerViewingOutlet=null;
  }else{
    const outletId=document.getElementById('login-outlet').value;
    if(!outletId){err.textContent="Please select your outlet.";return;}
    const mgr=DB.managers[outletId];
    if(pin!==mgr.pin){err.textContent="Incorrect PIN for this outlet.";return;}
    if(typed&&!mgr.names.includes(typed)){mgr.names.push(typed);saveDB(DB);}
    session={role:'manager',name,outletId};
    sendOwnerLoginEmail(name,outletId); // fire-and-forget; never blocks manager login
  }
  err.textContent='';
  enterApp();
});
populateOutletSelect(document.getElementById('login-outlet'));
refreshLoginForm();

function renderTabsBar(){
  const bar=document.getElementById('tabs-bar');
  bar.innerHTML=tabsForRole().map(t=>`<div class="tab ${t.id===currentTab?'active':''}" data-tab="${t.id}">${t.label}</div>`).join('');
  bar.querySelectorAll('.tab').forEach(el=>{
    el.addEventListener('click',()=>{
      pendingSyncRender=false; // navigating tabs will render fresh data anyway
      if(el.dataset.tab==='home'&&session.role==='owner'&&ownerViewingOutlet){
        ownerViewingOutlet=null;currentTab='home';renderAll();return;
      }
      currentTab=el.dataset.tab;renderAll();
    });
  });
}

function updateTopbarContext(){
  document.getElementById('staff-pill-name').textContent=`${session.name} (${session.role==='owner'?'Owner':'Manager'})`;
  const ctxLabel=document.getElementById('outlet-context-label');
  const switcher=document.getElementById('owner-outlet-switcher');
  if(session.role==='manager'){
    ctxLabel.textContent=getOutlet(session.outletId).name;

function enterApp(){
  document.getElementById('login-screen').style.display='none';

function renderAll(){
  pendingSyncRender=false; // any full render (tab switch, form submit, etc.) already catches up the view
  renderTabsBar();updateTopbarContext();
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const map={home:'view-owner-home',billing:'view-billing',today:'view-today',appointments:'view-appointments',memberships:'view-memberships',customers:'view-customers',marketing:'view-marketing',expenses:'view-expenses',final:'view-final',analytics:'view-analytics',therapists:'view-therapists',leaves:'view-leaves',settings:'view-settings'};
  const viewEl=document.getElementById(map[currentTab]);
  if(!viewEl)return;
  viewEl.classList.add('active');
  if(currentTab==='home')     renderOwnerHome();
  if(currentTab==='billing')  renderBilling();
  if(currentTab==='today')    renderToday();
  if(currentTab==='appointments')renderAppointments();
  if(currentTab==='memberships')renderMemberships();
  if(currentTab==='customers')renderCustomers();
  if(currentTab==='marketing')renderMarketing();
  if(currentTab==='expenses') renderExpenses();
  if(currentTab==='final')    renderFinal();
  if(currentTab==='analytics')renderAnalytics();
  if(currentTab==='therapists')renderTherapistsTab();
  if(currentTab==='leaves')   renderLeavesTab();
  if(currentTab==='settings') renderSettings();
}

  return DB.entries.filter(e=>e.outletId===outletId&&e.date.slice(0,7)===ym);
}
function outletExpensesForMonth(outletId,ym){
  return DB.expenses.filter(e=>e.outletId===outletId&&e.date.slice(0,7)===ym);
}

function renderOwnerHome(){
  const el=document.getElementById('view-owner-home');
  const ym=todayISO().slice(0,7);
  const today=todayISO();
  const groupMonthRevenue=OUTLETS.reduce((s,o)=>s+outletEntriesForMonth(o.id,ym).reduce((s2,e)=>s2+e.finalAmount,0),0);
  const groupMonthExpenses=OUTLETS.reduce((s,o)=>s+outletExpensesForMonth(o.id,ym).reduce((s2,e)=>s2+e.amount,0),0);
  const groupToday=DB.entries.filter(e=>e.date===today).reduce((s,e)=>s+e.finalAmount,0);
  const groupTarget=Object.values(DB.monthlyTargets).reduce((a,b)=>a+b,0);
  const groupPct=Math.min(100,(groupMonthRevenue/groupTarget)*100);

  const cards=OUTLETS.map(o=>{
    const me=outletEntriesForMonth(o.id,ym);
    const monthTotal=me.reduce((s,e)=>s+e.finalAmount,0);
    const monthExp=outletExpensesForMonth(o.id,ym).reduce((s,e)=>s+e.amount,0);
    const todayTotal=DB.entries.filter(e=>e.outletId===o.id&&e.date===today).reduce((s,e)=>s+e.finalAmount,0);
    const target=DB.monthlyTargets[o.id]||500000;
    const pct=Math.min(100,(monthTotal/target)*100);
    const profit=monthTotal-monthExp;
    return `
    <div class="outlet-card" data-outlet="${o.id}">
      <div class="name">${o.name}</div>
      <div class="num">${rupee(monthTotal)}</div>
      <div class="sub">Month revenue · Today: ${rupee(todayTotal)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct.toFixed(1)}%"></div></div>
      <div class="sub" style="margin-top:6px;">${pct.toFixed(0)}% of ${rupee(target)} target</div>
      <div class="outlet-mini-stats">
        <span>Exp: ${rupee(monthExp)}</span>
        <span style="color:${profit>=0?'var(--sage)':'var(--rose)'}">Net: ${rupee(profit)}</span>
      </div>
      <div class="outlet-cta">Click to enter →</div>
    </div>`;
  }).join('');

  el.innerHTML=`
    <div class="page-head"><div><h1>Group Overview</h1><p>Five spa outlets · click any card to view or manage it</p></div></div>
    <div class="stat-cards" style="grid-template-columns:repeat(4,1fr);margin-bottom:24px;">
      <div class="stat-card gold"><div class="lab">Group Revenue (Month)</div><div class="val">${rupee(groupMonthRevenue)}</div></div>
      <div class="stat-card"><div class="lab">Group Revenue (Today)</div><div class="val">${rupee(groupToday)}</div></div>
      <div class="stat-card"><div class="lab">Group Expenses (Month)</div><div class="val">${rupee(groupMonthExpenses)}</div></div>
      <div class="stat-card"><div class="lab">Net Profit (Month)</div><div class="val" style="color:${groupMonthRevenue-groupMonthExpenses>=0?'var(--sage)':'var(--rose)'}">${rupee(groupMonthRevenue-groupMonthExpenses)}</div></div>
    </div>
    <div class="group-progress-wrap">
      <div class="group-prog-label"><span>Group Target Progress</span><span>${groupPct.toFixed(0)}% of ${rupee(groupTarget)}</span></div>
      <div class="bar-track" style="height:8px;border-radius:4px;"><div class="bar-fill" style="width:${groupPct.toFixed(1)}%;background:var(--gold);"></div></div>
    </div>
    <div class="outlet-grid">${cards}</div>

    <div class="owner-outlet-drill" id="owner-outlet-section" style="display:none;"></div>
  `;

  el.querySelectorAll('.outlet-card').forEach(card=>{
    card.addEventListener('click',()=>{
      ownerViewingOutlet=card.dataset.outlet;
      currentTab='billing';
      renderAll();
    });
  });
}

function buildMemberReportText(entry){
  if(entry.isMembershipDuePayment){
    return `*MEMBER DUE PAYMENT RECEIVED*
Report-${formatDateLabel(entry.date)}
Member Name - ${entry.guest||'—'}
Contact - ${entry.contact||'00'}
Membership Code - ${entry.membershipCode||'—'}
Amount Received - ${entry.membershipAmount.toLocaleString('en-IN')} By ${paymentModeLabel(entry)} Payment
Remaining Due - ${entry.membershipDue.toLocaleString('en-IN')}
Received By: ${entry.preparedBy}
🙏 Thanks.`;
  }
  const gstLine=entry.membershipGstApplied
    ? `GST (5%) - ${Math.round(entry.membershipGstAmount||0).toLocaleString('en-IN')}\n`
    : '';
  const paymentLine=entry.membershipAmount>0
    ? `Amount Received Today- ${entry.membershipAmount.toLocaleString('en-IN')} By ${paymentModeLabel(entry)} Payment`
    : `Amount Received Today- 00`;
  const dueLine=entry.isMembershipPurchase&&entry.membershipDue>0
    ? `\nAmount Due - ${entry.membershipDue.toLocaleString('en-IN')}`
    : '';
  return `*MEMBER CLIENT*
Report-${formatDateLabel(entry.date)}
*NO.of therapy - ${entry.therapyNo}*
Member Name - ${entry.guest||'—'}
Contact - ${entry.contact||'00'}
Therapy name - ${entry.therapy||'—'}
Time - ${entry.duration||'—'} Min
IN Time - ${formatTime12(entry.intime)}
Out Time - ${formatTime12(entry.outtime)}
THERAPIST- ${entry.therapist||'—'}
${gstLine}${paymentLine}${dueLine}
Therapy Issues - ${String(entry.membershipTotalTherapies).padStart(2,'0')}
Therapy due - ${String(entry.membershipRemainingAfter).padStart(2,'0')}`;
}

function paymentModeLabel(entry){
  const modes=[];
  if(entry.cash>0) modes.push('Cash');
  if(entry.online>0) modes.push('Online');
  if(entry.card>0) modes.push('Card');
  if(!modes.length) return 'Cash';
  if(modes.length===1) return modes[0];
  // split payment — describe with amounts
  const parts=[];
  if(entry.cash>0) parts.push(`Cash ${rupee(entry.cash)}`);
  if(entry.online>0) parts.push(`Online ${rupee(entry.online)}`);
  if(entry.card>0) parts.push(`Card ${rupee(entry.card)}`);
  return 'Split ('+parts.join(' + ')+')';
}

function renderRedeemBillingPanel(outletId){
  const box=document.getElementById('mship-billing-body');
  function paint(){
    if(billingState.redeemMember){
      const m=DB.memberships.find(x=>x.id===billingState.redeemMember);
      if(!m||membershipStatus(m)!=='active'||!canRedeemAt(m.group,outletId)){
        billingState.redeemMember=null;paint();return;
      }
      box.innerHTML=`
        <div style="display:flex;justify-content:space-between;align-items:center;background:var(--cream);border:1.5px solid var(--gold);border-radius:10px;padding:10px 14px;">
          <div><b style="color:var(--teal-900);">${m.guest}</b> · ${m.code} · ${membershipRemaining(m)} of ${m.totalTherapies} therapies left
          <div style="font-size:.74rem;">This visit will be logged as a Member Client session — already paid, ₹0 due today.</div></div>
          <button class="del" id="mship-clear-btn" style="color:var(--rose);">Remove</button>
        </div>`;
      document.getElementById('mship-clear-btn').addEventListener('click',()=>{billingState.redeemMember=null;renderBilling();});
    } else {
      box.innerHTML=`
        <div class="search-row" style="margin-bottom:10px;">
          <input id="f-mship-search" type="text" placeholder="Search member by code, name, or phone…">
        </div>
        <div id="mship-lookup-result" style="font-size:.85rem;color:var(--ink-soft);">Search above to attach a member and redeem today's session — no charge, it's already paid for.</div>`;
      document.getElementById('f-mship-search').addEventListener('input',e=>{
        const q=e.target.value.trim();
        const resultBox=document.getElementById('mship-lookup-result');
        if(!q){resultBox.innerHTML='';return;}
        const found=findMembership(q).filter(m=>canRedeemAt(m.group,outletId));
        if(!found.length){resultBox.innerHTML=`<span>No matching active member found for this outlet.</span>`;return;}
        resultBox.innerHTML=found.map(m=>{
          const status=membershipStatus(m);
          return `<div style="display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 13px;margin-bottom:6px;cursor:pointer;" data-pick-member="${m.id}">
            <span><b style="color:var(--teal-900);">${m.guest}</b> · ${m.code} · ${m.contact||'—'}</span>
            <span class="mship-badge ${status}">${status}${status==='active'?' · '+membershipRemaining(m)+' left':''}</span>
          </div>`;
        }).join('');
        resultBox.querySelectorAll('[data-pick-member]').forEach(row=>row.addEventListener('click',()=>{
          const m=DB.memberships.find(x=>x.id===row.dataset.pickMember);
          if(membershipStatus(m)!=='active'){showToast('This membership is not active');return;}
          if(membershipRemaining(m)<=0){showToast('No therapies remaining on this membership');return;}
          billingState.redeemMember=m.id;
          const last=lastRedemptionOf(m);
          billingState.pendingPrefill={
            guest:m.guest, contact:m.contact||'',
            therapist:last?last.therapist:'', therapy:last?last.therapy:'', duration:last?last.duration:''
          };
          renderBilling();
        }));
      });
    }
  }
  paint();
}

      : `Selecting a plan sets today's session as the member's first redemption (Therapy 1 of ${plan?plan.therapies:'…'}). Enter the amount actually received below (cash/online/card) — ${billingState.newMembershipPayMode==='partial'?'any shortfall against the total payable will be tracked as Due on the membership.':'this should match the total payable, or the balance will be tracked as Due.'}`}</p>

  box.querySelectorAll('[data-pick-newgroup]').forEach(btn=>btn.addEventListener('click',()=>{

    billingState.newMembershipPayMode=btn.dataset.pickPaymode;
    renderNewMembershipBillingPanel(outletId);updateCalcGlobal();

  const gstBox=document.getElementById('f-mship-gst');
  if(gstBox) gstBox.addEventListener('change',e=>{

// Shows/hides the Therapist/Therapy/Duration/Price fields in the Guest & Session

function syncMembershipSkipVisibility(){
  const skip=billingState.mshipTab==='new'&&billingState.newMembershipPlan!==null&&billingState.newMembershipSkipTherapy;
  ['fld-therapist','fld-therapy','fld-duration','fld-price'].forEach(id=>{

}

  if(canUseMembership){

  function isNewMembershipMode(){ return billingState.mshipTab==='new'&&billingState.newMembershipPlan!==null; }

  }
  function applyPrice(){

      document.getElementById('f-price').value=0;

  ['f-price','f-discount','f-cash','f-online','f-card','f-roompost'].forEach(id=>{

  /* ── Repeat-customer autofill ──
     Looks up the outlet's customer directory (built from past entries +
     memberships) by mobile number OR name, and auto-fills Guest Name,
     Contact, Room No., Therapist, Therapy, Duration and Price from their
     most recent visit — all fields stay normal, fully editable inputs,
     so staff can change any of them afterward. */
  (function wireRepeatCustomerAutofill(){
    const custDirectory=buildCustomerDirectory(outletId);
    const custByMobile={};
    custDirectory.forEach(c=>{ if(c.contact) custByMobile[normalizeMobile(c.contact)]=c; });
    const escAttr=s=>String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
    const nameListEl=document.getElementById('cust-name-list');
    const contactListEl=document.getElementById('cust-contact-list');
    nameListEl.innerHTML=custDirectory.filter(c=>c.name&&c.name!=='Guest').map(c=>`<option value="${escAttr(c.name)}">`).join('');
    contactListEl.innerHTML=custDirectory.filter(c=>c.contact).map(c=>`<option value="${escAttr(c.contact)}">${escAttr(c.name)}</option>`).join('');

    const guestEl=document.getElementById('f-guest');
    const contactEl=document.getElementById('f-contact');
    const roomEl=document.getElementById('f-room');
    const therapistEl=document.getElementById('f-therapist');
    const therapyEl=document.getElementById('f-therapy');
    const durationEl=document.getElementById('f-duration');
    const priceEl=document.getElementById('f-price');
    const matchNoteEl=document.getElementById('cust-match-note');
    // track what WE auto-filled, so a later manual edit by staff is never overwritten again
    let lastAutofilled={name:null,room:null,therapist:null,therapy:null,duration:null,price:null};

    function lastVisitOf(match){
      if(!match.visits||!match.visits.length) return null;
      return [...match.visits].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];
    }
    function lastKnownRoom(match){
      if(!match.visits||!match.visits.length) return '';
      const withRoom=[...match.visits].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).find(v=>v.room&&v.room.trim());
      return withRoom?withRoom.room.trim():'';
    }
    function applyMatch(match){
      if(!guestEl.value.trim()||guestEl.value.trim()===lastAutofilled.name){
        guestEl.value=match.name; lastAutofilled.name=match.name;
      }
      if(match.contact&&!contactEl.value.trim()){
        contactEl.value=match.contact;
      }
      const room=(match.room&&match.room.trim())?match.room.trim():lastKnownRoom(match);
      if(room&&(!roomEl.value.trim()||roomEl.value.trim()===lastAutofilled.room)){
        roomEl.value=room; lastAutofilled.room=room;
      }
      const lastVisit=lastVisitOf(match);
      let therapyLabel='';
      if(lastVisit){
        // Therapist
        if(lastVisit.therapist&&(!therapistEl.value||therapistEl.value===lastAutofilled.therapist)){
          if([...therapistEl.options].some(o=>o.value===lastVisit.therapist)){
            therapistEl.value=lastVisit.therapist; lastAutofilled.therapist=lastVisit.therapist;
          }
        }
        // Therapy + Duration + Price (only offered when nothing chosen yet or it's what we set last time)
        if(lastVisit.therapy&&(!therapyEl.value||therapyEl.value===lastAutofilled.therapy)){
          const menuIdx=menu.findIndex(m=>m.name===lastVisit.therapy);
          if(menuIdx>-1){
            therapyEl.value=String(menuIdx);
            therapyEl.dispatchEvent(new Event('change'));
            lastAutofilled.therapy=String(menuIdx);
            if(lastVisit.duration&&[...durationEl.options].some(o=>o.value===String(lastVisit.duration))){
              durationEl.value=String(lastVisit.duration);
              durationEl.dispatchEvent(new Event('change'));
              lastAutofilled.duration=String(lastVisit.duration);
            }
            // Use the exact price they paid last time (menu prices can change over time),
            // still a normal editable number input.
            if(lastVisit.price!=null&&(!priceEl.value||Number(priceEl.value)===Number(lastAutofilled.price))){
              priceEl.value=lastVisit.price;
              lastAutofilled.price=lastVisit.price;
              updateCalc();
            }
          }
          therapyLabel=`${lastVisit.therapy}${lastVisit.duration?` (${lastVisit.duration} min)`:''}${lastVisit.price!=null?` @ ${rupee(lastVisit.price)}`:''}`;
        }
      }
      const lastVisitLabel=match.lastVisitAt?formatDateLabel(new Date(match.lastVisitAt).toISOString().slice(0,10)):'—';
      matchNoteEl.style.display='flex';
      matchNoteEl.style.alignItems='center';
      matchNoteEl.style.gap='10px';
      const noteText=`↺ Returning guest — ${match.visitCount} visit${match.visitCount===1?'':'s'} on record, last on ${lastVisitLabel}${room?` · room ${room}`:''}${therapyLabel?` · last therapy: ${therapyLabel}`:''}${match.outlets.size>1?' (across outlets)':''}.${match.notes?` 📝 ${match.notes}`:''}`;
      matchNoteEl.innerHTML=`${customerAvatarHtml(match.key,26)}<span>${noteText.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</span>`;
    }
    function tryAutofillFromContact(){
      const mobile=normalizeMobile(contactEl.value);
      if(mobile.length!==10){ matchNoteEl.style.display='none'; return; }
      const match=custByMobile[mobile];
      if(!match){ matchNoteEl.style.display='none'; return; }
      applyMatch(match);
    }
    function tryAutofillFromName(){
      const name=guestEl.value.trim();
      if(!name) return;
      const matches=custDirectory.filter(c=>c.name.trim().toLowerCase()===name.toLowerCase());
      if(matches.length===1) applyMatch(matches[0]);
    }
    contactEl.addEventListener('input',tryAutofillFromContact);
    guestEl.addEventListener('input',tryAutofillFromName);
    guestEl.addEventListener('change',tryAutofillFromName);
    if(contactEl.value.trim()) tryAutofillFromContact();
    else if(guestEl.value.trim()) tryAutofillFromName();
  })();

  const gstToggleEl=document.getElementById('f-apply-gst');
  if(gstToggleEl) gstToggleEl.addEventListener('change',()=>{
    const gstLab=document.getElementById('sum-gst-lab');
    if(gstLab) gstLab.textContent=gstToggleEl.checked?'GST (5%)':'GST';
    updateCalc();
  });
  function getCalc(){
    if(billingState.redeemMember) return calcEntry(0,'flat',0);
    if(isNewMembershipMode()){
      // Membership sale: the amount charged is the plan price, plus optional GST.
      const plan=currentNewPlan();
      const gstOn=billingState.newMembershipGst;
      const gstAmt=gstOn?Math.round(plan.amount*GST_RATE):0;
      const total=plan.amount+gstAmt;
      return {price:total,discountAmount:0,beforeGst:plan.amount,gst:gstAmt,totalAfterDiscount:total};
    }
    const applyGstEl=document.getElementById('f-apply-gst');
    const applyGst=applyGstEl?applyGstEl.checked:true;
    const baseCalc=calcEntry(document.getElementById('f-price').value,billingState.discountType,document.getElementById('f-discount').value);
    if(!applyGst) return{...baseCalc,gst:0,totalAfterDiscount:baseCalc.beforeGst};
    return baseCalc;
  }
  function updateCalc(){
    const c=getCalc();
    document.getElementById('sum-beforegst').textContent=rupee(c.beforeGst);
    document.getElementById('sum-gst').textContent=rupee(c.gst);
    document.getElementById('sum-total').textContent=rupee(c.totalAfterDiscount);
    updatePreview(c);
  }
  window.__billingUpdateCalc=updateCalc;
  function updatePreview(c){
    const idx=document.getElementById('f-therapy').value;
    const isMemberVisit=!!billingState.redeemMember||isNewMembershipMode();
    const cash=Number(document.getElementById('f-cash').value)||0;
    const online=Number(document.getElementById('f-online').value)||0;
    const card=Number(document.getElementById('f-card').value)||0;
    const roompost=Number(document.getElementById('f-roompost').value)||0;
    if(isMemberVisit){
      let existing=null;
      if(billingState.redeemMember) existing=DB.memberships.find(x=>x.id===billingState.redeemMember);
      const plan=currentNewPlan();
      const skipTherapyToday=!existing&&isNewMembershipMode()&&billingState.newMembershipSkipTherapy;
      const totalTherapies=existing?existing.totalTherapies:(plan?plan.therapies:0);
      const usedBefore=existing?membershipUsed(existing):0;
      const remainingAfter=skipTherapyToday?totalTherapies:Math.max(0,totalTherapies-usedBefore-1);
      const totalPaidToday=cash+online+card+roompost;
      const totalPayable=existing?0:c.totalAfterDiscount;
      const dueAfter=existing?0:Math.max(0,Math.round(totalPayable-totalPaidToday));

        membershipAmount:existing?0:totalPaidToday,
        membershipDue:dueAfter,
        membershipGstApplied:!existing&&billingState.newMembershipGst,
        membershipGstAmount:!existing?c.gst:0,
        membershipTotalTherapies:totalTherapies,
        membershipRemainingAfter:remainingAfter
      };

    } else {
      const fake={outletId,date:document.getElementById('f-date').value||date,therapyNo:therapyNo,
        guest:document.getElementById('f-guest').value,room:document.getElementById('f-room').value,
