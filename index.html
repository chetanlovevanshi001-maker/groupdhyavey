          </div>
        </td>
      </tr>`;
    }).join('');
    document.getElementById('outlet-detail-table').innerHTML=`
      <table style="width:100%;border-collapse:collapse;font-size:0.9rem;">
        <thead><tr style="border-bottom:1px solid var(--line);">
          <th style="text-align:left;padding:8px 6px;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);">Outlet</th>
          <th style="text-align:left;padding:8px 6px;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);">Revenue</th>
          <th style="text-align:left;padding:8px 6px;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);">Expenses</th>
          <th style="text-align:left;padding:8px 6px;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);">Net Profit</th>
          <th style="text-align:left;padding:8px 6px;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);">Target</th>
          <th style="text-align:left;padding:8px 6px;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);">Progress</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  // Payment mode breakdown — gross sales per mode, minus expenses paid by that mode = net in hand
  const pmGross={cash:0,online:0,card:0,roompost:0};
  monthScope.forEach(e=>{
    pmGross.cash+=(e.cash||0);
    pmGross.online+=(e.online||0);
    pmGross.card+=(e.card||0);
    pmGross.roompost+=(e.roompost||0);
  });
  // Map expense payment modes to sales buckets
  const pmExpense={cash:0,online:0,card:0,roompost:0};
  monthExpScope.forEach(e=>{
    const m=(e.paymentMode||'').toLowerCase();
    if(m==='cash') pmExpense.cash+=e.amount;
    else if(m==='online/upi'||m==='upi'||m==='online') pmExpense.online+=e.amount;
    else if(m==='card') pmExpense.card+=e.amount;
    else if(m==='bank transfer') pmExpense.online+=e.amount; // bank transfer → deducts from online/upi bucket
  });
  const pmNet={
    cash:pmGross.cash-pmExpense.cash,
    online:pmGross.online-pmExpense.online,
    card:pmGross.card-pmExpense.card,
    roompost:pmGross.roompost-pmExpense.roompost
  };
  const pmGrossTotal=pmGross.cash+pmGross.online+pmGross.card+pmGross.roompost||1;
  function pmPct(v){return pmGrossTotal>1?((v/pmGrossTotal)*100).toFixed(1)+'%':'0%';}
  function netColor(v){return v>=0?'var(--teal-900)':'var(--rose)';}

  document.getElementById('pay-mode-cards').innerHTML=`
    <div class="pay-mode-card cash">
      <div class="pm-icon">💵</div><div class="pm-lab">Cash</div>
      <div class="pm-val">${rupee(pmNet.cash)}</div>
      <div class="pm-pct">Gross ${rupee(pmGross.cash)}${pmExpense.cash?` − Exp ${rupee(pmExpense.cash)}`:''}</div>
    </div>
    <div class="pay-mode-card upi">
      <div class="pm-icon">📲</div><div class="pm-lab">UPI / Online</div>
      <div class="pm-val" style="color:${netColor(pmNet.online)}">${rupee(pmNet.online)}</div>
      <div class="pm-pct">Gross ${rupee(pmGross.online)}${pmExpense.online?` − Exp ${rupee(pmExpense.online)}`:''}</div>
    </div>
    <div class="pay-mode-card card">
      <div class="pm-icon">💳</div><div class="pm-lab">Card</div>
      <div class="pm-val" style="color:${netColor(pmNet.card)}">${rupee(pmNet.card)}</div>
      <div class="pm-pct">Gross ${rupee(pmGross.card)}${pmExpense.card?` − Exp ${rupee(pmExpense.card)}`:''}</div>
    </div>
    <div class="pay-mode-card roompost">
      <div class="pm-icon">🏨</div><div class="pm-lab">Room Post</div>
      <div class="pm-val" style="color:${netColor(pmNet.roompost)}">${rupee(pmNet.roompost)}</div>
      <div class="pm-pct">Gross ${rupee(pmGross.roompost)}${pmExpense.roompost?` − Exp ${rupee(pmExpense.roompost)}`:''}</div>
    </div>
  `;

  // Payment mode bar detail — show net values with gross for reference
  const pmItems=[
    {label:'Cash',gross:pmGross.cash,exp:pmExpense.cash,net:pmNet.cash,color:'var(--sage)'},
    {label:'UPI / Online',gross:pmGross.online,exp:pmExpense.online,net:pmNet.online,color:'var(--teal-600)'},
    {label:'Card',gross:pmGross.card,exp:pmExpense.card,net:pmNet.card,color:'var(--gold)'},
    {label:'Room Post',gross:pmGross.roompost,exp:pmExpense.roompost,net:pmNet.roompost,color:'var(--rose)'},
  ];
  document.getElementById('pay-mode-bar-detail').innerHTML=pmItems.map(pm=>`
    <div>
      <div style="display:flex;justify-content:space-between;font-size:.78rem;font-weight:600;margin-bottom:2px;">
        <span style="color:var(--charcoal);">${pm.label}</span>
        <span style="color:${pm.net>=0?'var(--teal-900)':'var(--rose)'};">${rupee(pm.net)} net</span>
      </div>
      ${pm.exp?`<div style="font-size:.68rem;color:var(--ink-soft);margin-bottom:3px;">Gross ${rupee(pm.gross)} − Exp ${rupee(pm.exp)}</div>`:''}
      <div style="height:6px;border-radius:4px;background:var(--line);overflow:hidden;">
        <div style="height:100%;width:${pmPct(pm.gross)};background:${pm.color};border-radius:4px;opacity:0.85;"></div>
      </div>
    </div>
  `).join('');

  chartInstances.paymode=new Chart(document.getElementById('chart-paymode'),{
    type:'doughnut',
    data:{
      labels:['Cash (net)','UPI / Online (net)','Card (net)','Room Post (net)'],
      datasets:[{
        data:[Math.max(0,pmNet.cash),Math.max(0,pmNet.online),Math.max(0,pmNet.card),Math.max(0,pmNet.roompost)],
        backgroundColor:['rgba(125,156,135,0.85)','rgba(47,117,117,0.8)','rgba(201,164,104,0.85)','rgba(185,105,95,0.8)'],
        borderWidth:2,borderColor:'var(--paper)',hoverOffset:6
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:false,cutout:'62%',
      plugins:{
        legend:{position:'bottom',labels:{boxWidth:12,font:{size:11},padding:10}},
        tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${rupee(ctx.parsed)}`}}
      }
    }
  });

  // Expense mode breakdown
  const expByMode={};
  monthExpScope.forEach(e=>{expByMode[e.paymentMode]=(expByMode[e.paymentMode]||0)+e.amount;});
  const expModeEntries=Object.entries(expByMode).sort((a,b)=>b[1]-a[1]);
  document.getElementById('exp-mode-cards').innerHTML=expModeEntries.length
    ?expModeEntries.map(([mode,amt])=>`<div class="exp-mode-card"><span class="em-lab">${mode}</span><span class="em-val">${rupee(amt)}</span></div>`).join('')
    :`<p style="color:var(--ink-soft);font-size:0.85rem;grid-column:1/-1;">No expenses this month.</p>`;

  // Therapist leaderboard
  const byTherapist={};
  monthScope.forEach(e=>{byTherapist[e.therapist]=(byTherapist[e.therapist]||0)+e.finalAmount;});
  const ranked=Object.entries(byTherapist).sort((a,b)=>b[1]-a[1]);
  document.getElementById('leaderboard').innerHTML=ranked.length?ranked.map(([name,total],i)=>`
    <div class="leaderboard-row"><div class="rank">#${i+1}</div><div>${name}</div><div class="amt">${rupee(total)}</div></div>
  `).join(''):`<p style="color:var(--ink-soft);font-size:0.88rem;">No data yet.</p>`;

  // Expense breakdown by category
  const byCat={};
  monthExpScope.forEach(e=>{byCat[e.category]=(byCat[e.category]||0)+e.amount;});
  const catRanked=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const totalExpCat=monthExpScope.reduce((s,e)=>s+e.amount,0)||1;
  document.getElementById('expense-breakdown').innerHTML=catRanked.length?catRanked.map(([cat,amt])=>`
    <div class="leaderboard-row">
      <div class="rank" style="font-size:0.75rem;">₹</div>
      <div style="flex:1;">
        <div style="font-size:.85rem;">${cat}</div>
        <div style="height:4px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden;">
          <div style="height:100%;width:${((amt/totalExpCat)*100).toFixed(0)}%;background:var(--rose);border-radius:3px;opacity:0.7;"></div>
        </div>
      </div>
      <div class="amt">${rupee(amt)}</div>
    </div>
  `).join(''):`<p style="color:var(--ink-soft);font-size:0.88rem;">No expenses this month.</p>`;

  // Yearly summary
  const monthsActive=new Set(yearScope.map(e=>e.date.slice(0,7))).size||1;
  const yearExpTotal=yearExpScope.reduce((s,e)=>s+e.amount,0);
  document.getElementById('yearly-summary').innerHTML=`
    <div class="leaderboard-row"><div></div><div>Total Revenue (${yearNow})</div><div class="amt">${rupee(yearRev)}</div></div>
    <div class="leaderboard-row"><div></div><div>Total Expenses (${yearNow})</div><div class="amt">${rupee(yearExpTotal)}</div></div>
    <div class="leaderboard-row"><div></div><div>Net Profit (${yearNow})</div><div class="amt" style="color:${yearRev-yearExpTotal>=0?'var(--sage)':'var(--rose)'}">${rupee(yearRev-yearExpTotal)}</div></div>
    <div class="leaderboard-row"><div></div><div>Total Therapies</div><div class="amt">${yearScope.length}</div></div>
    <div class="leaderboard-row"><div></div><div>Avg Monthly Revenue</div><div class="amt">${rupee(yearRev/monthsActive)}</div></div>
  `;

  // Exports
  document.getElementById('rep-export-from').addEventListener('change',e=>{analyticsExportState.fromDate=e.target.value;});
  document.getElementById('rep-export-to').addEventListener('change',e=>{analyticsExportState.toDate=e.target.value;});
  document.getElementById('export-range-btn').addEventListener('click',()=>{
    const from=document.getElementById('rep-export-from').value||analyticsExportState.fromDate;
    const to=document.getElementById('rep-export-to').value||analyticsExportState.toDate;
    if(from>to){showToast('"From" date must be before "To" date');return;}
    const rangeScope=scope.filter(e=>e.date>=from&&e.date<=to&&!e.complimentary);
    exportToExcel(rangeScope,`Revenue_${scopeLabel.replace(/\s+/g,'_')}_${from}_to_${to}`,'Revenue');
  });
  document.getElementById('export-expenses-btn').addEventListener('click',()=>{
    const from=document.getElementById('rep-export-from').value||analyticsExportState.fromDate;
    const to=document.getElementById('rep-export-to').value||analyticsExportState.toDate;
    if(from>to){showToast('"From" date must be before "To" date');return;}
    const rangeExpScope=expScope.filter(e=>e.date>=from&&e.date<=to);
    exportExpensesToExcel(rangeExpScope,`Expenses_${scopeLabel.replace(/\s+/g,'_')}_${from}_to_${to}`);
  });
  const allBtn=document.getElementById('export-all-btn');
  if(allBtn) allBtn.addEventListener('click',()=>exportAllOutletsToExcel());
}

function entriesToSheetRows(entries){
  return entries.map(e=>({
    Date:e.date, Outlet:getOutlet(e.outletId)?.name||e.outletId, "Therapy No":e.therapyNo, Guest:e.guest,
    Contact:e.contact, Room:e.room, Therapist:e.therapist, Therapy:e.therapy, "Duration (min)":e.duration,
    "In Time":formatTime12(e.intime), "Out Time":formatTime12(e.outtime),
    "Discount Type":e.discountType, "Discount Value":e.discountValue, "Discount (₹)":Math.round(e.discountAmount),
    "Before GST":Math.round(e.beforeGst), "GST":Math.round(e.gst), "Total Amount":Math.round(e.finalAmount),
    Cash:Math.round(e.cash), Online:Math.round(e.online), Card:Math.round(e.card), "Room Post":Math.round(e.roompost),
    Complimentary:e.complimentary?'Yes':'No',
    "Membership Code":e.membershipCode||'—',
    "Membership Sale":e.isMembershipPurchase?'Yes':'No',
    "Prepared By":e.preparedBy
  }));
}
function expensesToSheetRows(expenses){
  return expenses.map(e=>({
    Date:e.date, Outlet:getOutlet(e.outletId)?.name||e.outletId, Category:e.category, Description:e.description,
    "Amount (₹)":Math.round(e.amount), "Payment Mode":e.paymentMode, "Added By":e.addedBy
  }));
}
function setColWidths(ws, widths){
  ws['!cols'] = widths.map(w=>({wch:w}));
}
function exportToExcel(entries,filename){
  const rows=entriesToSheetRows(entries);
  if(!rows.length){showToast('No data to export');return;}
  const ws=XLSX.utils.json_to_sheet(rows);
  setColWidths(ws,[12,28,8,20,14,10,18,28,10,8,8,10,10,12,12,10,14,10,10,10,12,10,16]);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Revenue');
  // Add payment summary sheet
  const totals={Cash:0,Online:0,Card:0,RoomPost:0,Total:0};
  rows.forEach(r=>{totals.Cash+=r.Cash||0;totals.Online+=r.Online||0;totals.Card+=r.Card||0;totals.RoomPost+=r['Room Post']||0;totals.Total+=r['Total Amount']||0;});
  const sumWs=XLSX.utils.json_to_sheet([
    {Label:'Total Revenue',Amount:totals.Total},
    {Label:'Cash',Amount:totals.Cash},
    {Label:'Online / UPI',Amount:totals.Online},
    {Label:'Card',Amount:totals.Card},
    {Label:'Room Post',Amount:totals.RoomPost},
    {Label:'Total Entries',Amount:rows.length},
    {Label:'Complimentary',Amount:rows.filter(r=>r.Complimentary==='Yes').length},
  ]);
  setColWidths(sumWs,[24,16]);
  XLSX.utils.book_append_sheet(wb,sumWs,'Summary');
  XLSX.writeFile(wb,filename+'.xlsx');
  showToast('Exported ✓');
}
function exportExpensesToExcel(expenses,filename){
  const rows=expensesToSheetRows(expenses);
  if(!rows.length){showToast('No expenses to export');return;}
  const ws=XLSX.utils.json_to_sheet(rows);
  setColWidths(ws,[12,28,22,36,14,16,16]);
  // Mode summary
  const byMode={};
  rows.forEach(r=>{byMode[r['Payment Mode']]=(byMode[r['Payment Mode']]||0)+(r['Amount (₹)']||0);});
  const modeRows=Object.entries(byMode).map(([m,v])=>({Mode:m,Amount:v}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Expenses');
  if(modeRows.length){
    const sumWs=XLSX.utils.json_to_sheet(modeRows);
    setColWidths(sumWs,[20,16]);
    XLSX.utils.book_append_sheet(wb,sumWs,'By Payment Mode');
  }
  XLSX.writeFile(wb,filename+'.xlsx');
  showToast('Exported ✓');
}
function exportAllOutletsToExcel(){
  const ymNow=todayISO().slice(0,7);
  const wb=XLSX.utils.book_new();
  OUTLETS.forEach(o=>{
    const revRows=entriesToSheetRows(DB.entries.filter(e=>e.outletId===o.id&&e.date.startsWith(ymNow)));
    const expRows=expensesToSheetRows(DB.expenses.filter(e=>e.outletId===o.id&&e.date.startsWith(ymNow)));
    if(revRows.length){
      const ws=XLSX.utils.json_to_sheet(revRows);
      setColWidths(ws,[12,28,8,20,14,10,18,28,10,8,8,10,10,12,12,10,14,10,10,10,12,10,16]);
      XLSX.utils.book_append_sheet(wb,ws,o.city+'_Rev');
    }
    if(expRows.length){
      const ws=XLSX.utils.json_to_sheet(expRows);
      setColWidths(ws,[12,28,22,36,14,16,16]);
      XLSX.utils.book_append_sheet(wb,ws,o.city+'_Exp');
    }
  });
  if(!wb.SheetNames.length){showToast('No data this month');return;}
  // Group summary sheet
  const sumRows=OUTLETS.map(o=>{
    const paid=DB.entries.filter(e=>e.outletId===o.id&&e.date.startsWith(ymNow)&&!e.complimentary);
    const exp=DB.expenses.filter(e=>e.outletId===o.id&&e.date.startsWith(ymNow)).reduce((s,e)=>s+e.amount,0);
    const rev=paid.reduce((s,e)=>s+e.finalAmount,0);
    return{Outlet:o.name,Revenue:rev,Expenses:exp,'Net Profit':rev-exp,
      Cash:paid.reduce((s,e)=>s+(e.cash||0),0),
      'Online/UPI':paid.reduce((s,e)=>s+(e.online||0),0),
      Card:paid.reduce((s,e)=>s+(e.card||0),0),
      'Room Post':paid.reduce((s,e)=>s+(e.roompost||0),0),
      Sessions:paid.length,Target:DB.monthlyTargets[o.id]||500000};
  });
  const sumWs=XLSX.utils.json_to_sheet(sumRows);
  setColWidths(sumWs,[28,14,14,14,12,14,12,12,10,14]);
  XLSX.utils.book_append_sheet(wb,sumWs,'Group Summary');
  // Move Group Summary to front
  wb.SheetNames = ['Group Summary', ...wb.SheetNames.filter(s=>s!=='Group Summary')];
  XLSX.writeFile(wb,'Dhyavey_Group_'+ymNow+'.xlsx');
  showToast('Full group export done ✓');
}

function renderTherapistsTab(){
  const outletId=activeOutletId();
  const el=document.getElementById('view-therapists');
  if(!outletId){ el.innerHTML=`<div class="page-head"><div><h1>Therapists</h1><p>Select an outlet to manage its therapists.</p></div></div>`; return; }
  const outlet=getOutlet(outletId);
  DB.therapists[outletId]=DB.therapists[outletId]||[];
  const therapists=DB.therapists[outletId];
  el.innerHTML=`
    <div class="page-head"><div><h1>${outlet.name} — Therapists</h1><p>Add, rename, or remove therapists for this outlet.</p></div></div>
    <div class="panel panel-pad settings-card" style="max-width:560px;">
      <div class="panel-head"><span class="num">💆</span> Therapists</div>
      <div id="therapist-list-mgr">${therapists.map(t=>`
        <div class="settings-row">
          <input data-rename-therapist="${t}" type="text" value="${t}" style="flex:1;padding:9px 12px;border-radius:9px;border:1.5px solid var(--line);font-family:var(--sans);font-size:.9rem;margin-right:8px;">
          <button class="btn btn-ghost" data-save-rename="${t}" style="margin-right:6px;">Save</button>
          <button class="del" data-remove-therapist-mgr="${t}" style="color:var(--rose);background:none;border:none;cursor:pointer;font-weight:700;">Remove</button>
        </div>`).join('')||'<p style="font-size:.85rem;color:var(--ink-soft);">No therapists yet — add one below.</p>'}</div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <input id="new-therapist-input-mgr" type="text" placeholder="Add therapist name…" style="flex:1;padding:10px 12px;border-radius:9px;border:1.5px solid var(--line);">
        <button class="btn btn-primary" id="add-therapist-btn-mgr">Add</button>
      </div>
    </div>
  `;
  document.getElementById('add-therapist-btn-mgr').addEventListener('click',()=>{
    const v=document.getElementById('new-therapist-input-mgr').value.trim();
    if(!v) return;
    if(DB.therapists[outletId].includes(v)){showToast('Therapist already exists');return;}
    DB.therapists[outletId].push(v);saveDB(DB);renderTherapistsTab();showToast('Therapist added');
  });
  document.querySelectorAll('[data-remove-therapist-mgr]').forEach(btn=>btn.addEventListener('click',async()=>{
    const name=btn.dataset.removeTherapistMgr;
    if(!await dhvConfirm(`Remove therapist "${name}"?`,'Remove','#c0392b')) return;
    DB.therapists[outletId]=DB.therapists[outletId].filter(t=>t!==name);saveDB(DB);renderTherapistsTab();showToast('Therapist removed');
  }));
  document.querySelectorAll('[data-save-rename]').forEach(btn=>btn.addEventListener('click',()=>{
    const oldName=btn.dataset.saveRename;
    const input=document.querySelector(`[data-rename-therapist="${oldName}"]`);
    const newName=input.value.trim();
    if(!newName){showToast('Name cannot be empty');return;}
    if(newName===oldName){showToast('No changes');return;}
    if(DB.therapists[outletId].includes(newName)){showToast('That name already exists');return;}
    const idx=DB.therapists[outletId].indexOf(oldName);
    if(idx>-1) DB.therapists[outletId][idx]=newName;
    // Keep historic entries' therapist labels intact (do not rewrite past records)
    saveDB(DB);renderTherapistsTab();showToast('Therapist renamed');
  }));
}

function leavePeople(outletId){
  const therapists=(DB.therapists[outletId]||[]).map(n=>({name:n,type:'therapist'}));
  const managers=((DB.managers[outletId]||{}).names||[]).map(n=>({name:n,type:'manager'}));
  return [...therapists,...managers];
}

  if(!outletId){ el.innerHTML=`<div class="page-head"><div><h1>Leave Tracker</h1><p>Select an outlet to track leaves.</p></div></div>`; return; }
  const outlet=getOutlet(outletId);
  DB.leaves[outletId]=DB.leaves[outletId]||[];
  const people=leavePeople(outletId);
  const ym=(el.dataset.month)||todayISO().slice(0,7);

    summary[l.personName].days += l.duration==='full'?1:0.5;
  });

  el.innerHTML=`
    <div class="page-head"><div><h1>${outlet.name} — Leave Tracker</h1><p>Record full-day and half-day leaves for therapists and managers.</p></div></div>

    <div class="panel panel-pad settings-card" style="max-width:640px;margin-bottom:20px;">
      <div class="panel-head"><span class="num">🗓️</span> Record a Leave</div>
      ${!people.length?`<p style="font-size:.85rem;color:var(--ink-soft);">Add therapists (Therapists tab) or managers (Owner Settings) first — they'll appear here.</p>`:`
      <div class="form-grid">
        <div class="field-sm">
          <label>Person</label>
          <select id="leave-person">${people.map(p=>`<option value="${p.name}" data-type="${p.type}">${p.name} (${p.type==='therapist'?'Therapist':'Manager'})</option>`).join('')}</select>
        </div>

        <div class="field-sm">

            <option value="full">Full Day</option>
            <option value="half">Half Day</option>
          </select>
        </div>
        <div class="field-sm" id="leave-session-wrap" style="display:none;">
          <label>Half — Which Session</label>
          <select id="leave-session"><option value="morning">Morning</option><option value="afternoon">Afternoon</option></select>
        </div>
        <div class="field-sm full"><label>Reason (optional)</label><input id="leave-reason" type="text" placeholder="e.g. Personal, Sick, Festival…"></div>
      </div>
      <div style="margin-top:14px;"><button class="btn btn-primary" id="leave-add-btn">Add Leave</button></div>`}
    </div>

    <div class="panel panel-pad settings-card" style="margin-bottom:20px;">
      <div class="panel-head"><span class="num">📊</span> Monthly Summary</div>
      <div class="field-sm" style="max-width:220px;margin-bottom:14px;"><label>Month</label><input id="leave-month-filter" type="month" value="${ym}"></div>
      ${Object.keys(summary).length?`
      <table class="menu-table"><thead><tr><th>Name</th><th>Role</th><th>Leave Days (${monthLabel(ym)})</th></tr></thead>
      <tbody>${Object.entries(summary).map(([name,s])=>`
        <tr><td>${name}</td><td style="color:var(--ink-soft);">${s.type==='therapist'?'Therapist':'Manager'}</td><td style="font-weight:700;">${s.days}</td></tr>`).join('')}</tbody></table>`
      :`<p style="font-size:.85rem;color:var(--ink-soft);">No leaves recorded for ${monthLabel(ym)}.</p>`}
    </div>

    <div class="panel panel-pad settings-card">
      <div class="panel-head"><span class="num">📋</span> Leave Records — ${monthLabel(ym)}</div>
      ${monthLeaves.length?`
      <table class="menu-table"><thead><tr><th>Date</th><th>Name</th><th>Role</th><th>Duration</th><th>Reason</th><th>Logged by</th><th></th></tr></thead>
      <tbody>${monthLeaves.map(l=>`
        <tr>
          <td style="white-space:nowrap;">${l.date}</td>
          <td>${l.personName}</td>
          <td style="color:var(--ink-soft);">${l.personType==='therapist'?'Therapist':'Manager'}</td>
          <td>${l.duration==='full'?'Full Day':'Half Day ('+(l.session==='afternoon'?'Afternoon':'Morning')+')'}</td>
          <td style="font-size:.82rem;color:var(--ink-soft);">${l.reason||'—'}</td>
          <td style="font-size:.82rem;color:var(--ink-soft);">${l.createdBy||'—'}</td>
          <td><button class="del" data-remove-leave="${l.id}" style="color:var(--rose);background:none;border:none;cursor:pointer;font-weight:700;">Remove</button></td>
        </tr>`).join('')}</tbody></table>`
      :`<p style="font-size:.85rem;color:var(--ink-soft);">No leave records for this month yet.</p>`}
    </div>
  `;

  const durSel=document.getElementById('leave-duration');
  if(durSel){
    durSel.addEventListener('change',()=>{
      document.getElementById('leave-session-wrap').style.display=durSel.value==='half'?'block':'none';
    });
    document.getElementById('leave-add-btn').addEventListener('click',async()=>{
      const personSel=document.getElementById('leave-person');
      const personName=personSel.value;
      const personType=personSel.selectedOptions[0].dataset.type;
      const date=document.getElementById('leave-date').value;
      const duration=durSel.value;
      const leaveSession=duration==='half'?document.getElementById('leave-session').value:null;
      const reason=document.getElementById('leave-reason').value.trim();
      if(!date){showToast('Pick a date');return;}
      if(DB.leaves[outletId].some(l=>l.personName===personName&&l.date===date&&(l.duration==='full'||duration==='full'))){
        if(!await dhvConfirm(`${personName} already has a leave logged on ${date}. Add another entry anyway?`,'Add anyway','#c0392b')) return;
      }
      DB.leaves[outletId].push({
        id:'lv_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
        personName,personType,date,duration,session:leaveSession,reason,
        createdAt:Date.now(),createdBy:(session&&session.name)||'—'
      });
      saveDB(DB);showToast('Leave recorded');renderLeavesTab();
    });
  }
  const monthFilter=document.getElementById('leave-month-filter');
  if(monthFilter){
    monthFilter.addEventListener('change',()=>{
      el.dataset.month=monthFilter.value;
      renderLeavesTab();
    });
  }
  document.querySelectorAll('[data-remove-leave]').forEach(btn=>btn.addEventListener('click',async()=>{
    const id=btn.dataset.removeLeave;
    if(!await dhvConfirm('Remove this leave record?','Remove','#c0392b')) return;
    DB.leaves[outletId]=DB.leaves[outletId].filter(l=>l.id!==id);
    saveDB(DB);showToast('Leave record removed');renderLeavesTab();
  }));
}

  document.getElementById('save-membership-plans-btn').addEventListener('click',()=>{
    if(!DB.membershipPlans) DB.membershipPlans={};
    Object.keys(MEMBERSHIP_GROUPS).forEach(gid=>{
      const plans=getPlansFromDOM(gid);
      if(plans.length){
        DB.membershipPlans[gid]=plans;
        MEMBERSHIP_GROUPS[gid].plans=plans; // update runtime too
      }
    });
    saveDB(DB);showToast('Membership plans saved ✓');
  });
  document.getElementById('backup-btn').addEventListener('click',()=>{
    const data=JSON.stringify(DB,null,2);
    const a=document.createElement('a');
    a.href='data:application/json;charset=utf-8,'+encodeURIComponent(data);
    a.download='dhyavey_backup_'+todayISO()+'.json';
    a.click();showToast('Backup downloaded ✓');
  });
  document.getElementById('clear-all-customer-data-btn').addEventListener('click',async()=>{
    if(!await dhvConfirm('This permanently deletes ALL billing entries, expenses, memberships, and customer records for every outlet.\n\nThis CANNOT be undone. Download a backup first!', 'Yes, Delete All', '#c0392b')) return;
    if(!await dhvConfirm('Second confirmation — are you absolutely sure?\n\nAll data across all 5 outlets will be wiped permanently and synced to the cloud immediately.', 'Yes, Wipe Everything', '#c0392b')) return;
    DB.entries=[];
    DB.expenses=[];
    DB.memberships=[];
    DB.membershipSeq=0;
    DB.smsLog=[];
    DB.deletedIds=[];
    saveDB(DB);
    showToast('All customer & billing data cleared across the group ✓');
    renderSettings();
  });
  document.getElementById('save-wa-links-btn').addEventListener('click',()=>{
    if(!DB.whatsappGroups) DB.whatsappGroups={};
    document.querySelectorAll('[data-wa-outlet]').forEach(inp=>{
      DB.whatsappGroups[inp.dataset.waOutlet]=inp.value.trim();
    });
    saveDB(DB);showToast('WhatsApp group links saved ✓');
  });
  document.getElementById('test-wa-links-btn').addEventListener('click',()=>{
    const links=document.querySelectorAll('[data-wa-outlet]');
    let tested=0;
    links.forEach(inp=>{
      const link=inp.value.trim();
      if(link){window.open(link,'_blank');tested++;}
    });
    if(!tested) showToast('No links saved yet — paste group links first');
    else showToast(`Opened ${tested} group link${tested>1?'s':''} to verify`);
  });
  document.getElementById('save-sms-config-btn').addEventListener('click',()=>{
    DB.smsConfig=DB.smsConfig||{};
    DB.smsConfig.enabled=document.getElementById('sms-enabled-toggle').checked;
    DB.smsConfig.provider=document.getElementById('sms-provider').value;
    DB.smsConfig.apiKey=document.getElementById('sms-api-key').value.trim();
    DB.smsConfig.senderId=document.getElementById('sms-sender-id').value.trim();
    DB.smsConfig.customUrlTemplate=document.getElementById('sms-custom-url').value.trim();
    DB.smsConfig.reminderDaysGap=parseInt(document.getElementById('sms-reminder-gap').value)||7;
    DB.smsConfig.templates=DB.smsConfig.templates||{};
    DB.smsConfig.templates.purchase=document.getElementById('sms-tpl-purchase').value;
    DB.smsConfig.templates.visit=document.getElementById('sms-tpl-visit').value;
    DB.smsConfig.templates.reminder=document.getElementById('sms-tpl-reminder').value;
    saveDB(DB);showToast('SMS settings saved ✓');renderSettings();
  });
  document.getElementById('sms-send-test-btn').addEventListener('click',async()=>{
    const num=document.getElementById('sms-test-number').value.trim();
    if(!num){showToast('Enter a test mobile number first');return;}
    const cfgPreview={
      enabled:true,
      provider:document.getElementById('sms-provider').value,
      apiKey:document.getElementById('sms-api-key').value.trim(),
      senderId:document.getElementById('sms-sender-id').value.trim(),
      route:'q',
      customUrlTemplate:document.getElementById('sms-custom-url').value.trim()
    };
    const oldCfg=DB.smsConfig; DB.smsConfig=Object.assign({},DB.smsConfig,cfgPreview);
    showToast('Sending test SMS…');
    const res=await sendClientSMS(num,'This is a test SMS from Dhyavey Wellness Group console.',{type:'test'});
    DB.smsConfig=oldCfg;saveDB(DB);
    showToast(res.ok?'Test SMS sent ✓ check the phone':'Test SMS failed — see SMS Activity log below for details');
    renderSettings();
  });
  document.getElementById('save-email-config-btn').addEventListener('click',()=>{
    DB.emailConfig=DB.emailConfig||{};
    DB.emailConfig.enabled=document.getElementById('email-enabled-toggle').checked;
    DB.emailConfig.ownerEmail=document.getElementById('email-owner-address').value.trim();
    DB.emailConfig.serviceId=document.getElementById('email-service-id').value.trim();
    DB.emailConfig.templateId=document.getElementById('email-template-id').value.trim();
    DB.emailConfig.publicKey=document.getElementById('email-public-key').value.trim();
    saveDB(DB);showToast('Owner login alert settings saved ✓');renderSettings();
  });
  document.getElementById('email-send-test-btn').addEventListener('click',async()=>{
    const cfgPreview={
      enabled:true,
      ownerEmail:document.getElementById('email-owner-address').value.trim(),
      serviceId:document.getElementById('email-service-id').value.trim(),
      templateId:document.getElementById('email-template-id').value.trim(),
      publicKey:document.getElementById('email-public-key').value.trim(),
    };
    if(!cfgPreview.ownerEmail){showToast('Enter the owner email address first');return;}
    const oldCfg=DB.emailConfig; DB.emailConfig=Object.assign({},DB.emailConfig,cfgPreview);
    showToast('Sending test email…');
    const res=await sendOwnerLoginEmail('Test Manager', OUTLETS[0].id);
    DB.emailConfig=oldCfg;saveDB(DB);
    showToast(res.ok?'Test email sent ✓ check the owner inbox':'Test email failed — see Login Alert Activity log below for details');
    renderSettings();
  });
}
function renderOutletSettings(el,outletId){
  const outlet=getOutlet(outletId);
  const menu=getMenuForOutlet(DB,outletId);
  const therapists=DB.therapists[outletId]||[];
  function menuRowsHtml(menuArr){
    return menuArr.map((m,mi)=>Object.entries(m.durations).map(([dur,price])=>`
      <tr>
        <td><input data-field="name" data-mi="${mi}" value="${m.name}"></td>
        <td><input data-field="duration" data-mi="${mi}" type="number" value="${dur}"></td>
        <td><input data-field="price" data-mi="${mi}" type="number" value="${price}"></td>
        <td><button class="del" data-remove-row style="color:var(--rose);background:none;border:none;cursor:pointer;">✕</button></td>
      </tr>`).join('')).join('');
  }
  el.innerHTML=`
    <div class="page-head"><div><h1>${outlet.name} — Settings</h1><p>Menu, therapists, and outlet-specific configuration</p></div></div>
    <div class="panel panel-pad settings-card" style="margin-bottom:20px;max-width:900px;">
      <div class="panel-head"><span class="num">📋</span> Therapy Menu</div>
      <table class="menu-table" id="menu-edit-table">
        <thead><tr><th>Therapy Name</th><th>Duration (min)</th><th>Price (₹, before GST)</th><th></th></tr></thead>
        <tbody>${menuRowsHtml(menu)}</tbody>
      </table>
      <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-ghost" id="add-menu-row-btn">+ Add Row</button>
        <button class="btn btn-primary" id="save-menu-btn">Save Menu</button>
      </div>
    </div>
    <div class="panel panel-pad settings-card" style="margin-bottom:20px;">
      <div class="panel-head"><span class="num">💆</span> Therapists</div>
      <div id="therapist-list">${therapists.map(t=>`
        <div class="settings-row"><div class="lab">${t}</div>
          <button class="del" data-remove-therapist="${t}" style="color:var(--rose);background:none;border:none;cursor:pointer;font-weight:700;">Remove</button>
        </div>`).join('')}</div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <input id="new-therapist-input" type="text" placeholder="Add therapist name…" style="flex:1;padding:10px 12px;border-radius:9px;border:1.5px solid var(--line);">
        <button class="btn btn-primary" id="add-therapist-btn">Add</button>
      </div>
    </div>
    ${(()=>{
      const mgid=OUTLET_MEMBERSHIP_GROUP[outletId];
      if(!mgid) return '';
      const mg=MEMBERSHIP_GROUPS[mgid];
      const plans=(DB.membershipPlans&&DB.membershipPlans[mgid])?DB.membershipPlans[mgid]:mg.plans;
      return `<div class="panel panel-pad settings-card" style="margin-bottom:20px;">
        <div class="panel-head"><span class="num">🧾</span> Membership GST</div>
        <div class="settings-row" style="border-bottom:none;">
          <div><div class="lab">Apply 5% GST on membership sales by default</div><div class="desc">Optional — you can still switch it on/off per sale when issuing a membership.</div></div>
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="outlet-membership-gst-toggle" ${DB.membershipGstEnabled?'checked':''} style="width:20px;height:20px;">
          </label>
        </div>
      </div>
      <div class="panel panel-pad settings-card" style="margin-bottom:20px;">
        <div class="panel-head"><span class="num">💎</span> ${mg.label} — Plans</div>
        <p style="font-size:0.82rem;color:var(--ink-soft);margin-bottom:14px;">Edit plan names, prices, therapy counts and validity. Changes apply to new memberships immediately.</p>
        <table class="menu-table" id="outlet-mp-table">
          <thead><tr><th>Tier Name</th><th>Amount (₹)</th><th>Therapies</th><th>Validity (months)</th><th></th></tr></thead>
          <tbody>${plans.map((p,pi)=>`
            <tr>
              <td><input data-omp-field="tier" data-omp-idx="${pi}" value="${p.tier}" style="width:100%;min-width:110px;"></td>
              <td><input data-omp-field="amount" data-omp-idx="${pi}" type="number" value="${p.amount}" style="width:100px;"></td>
              <td><input data-omp-field="therapies" data-omp-idx="${pi}" type="number" value="${p.therapies}" style="width:80px;"></td>
              <td><input data-omp-field="validityMonths" data-omp-idx="${pi}" type="number" value="${p.validityMonths}" style="width:80px;"></td>
              <td><button class="del" data-omp-remove style="color:var(--rose);background:none;border:none;cursor:pointer;font-weight:700;">✕</button></td>
            </tr>`).join('')}
          </tbody>
        </table>
        <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn btn-ghost" id="outlet-mp-add-btn">+ Add Plan</button>
          <button class="btn btn-primary" id="outlet-mp-save-btn">Save Plans</button>
        </div>
      </div>`;
    })()}
    <div class="panel panel-pad settings-card">
      <div class="panel-head"><span class="num">⚠</span> Data</div>
      <div class="settings-row" style="border-bottom:none;">
        <div><div class="lab">Clear all data for this outlet</div><div class="desc">Permanently removes all entries and expenses for ${outlet.name}.</div></div>
        <button class="btn btn-danger" id="clear-outlet-data-btn">Clear ${outlet.name} Data</button>
      </div>
    </div>
  `;
  document.getElementById('add-menu-row-btn').addEventListener('click',()=>{
    const tbody=document.querySelector('#menu-edit-table tbody');
    const row=document.createElement('tr');
    row.innerHTML=`<td><input data-field="name" value=""></td><td><input data-field="duration" type="number" value="60"></td><td><input data-field="price" type="number" value="0"></td><td><button class="del" data-remove-row style="color:var(--rose);background:none;border:none;cursor:pointer;">✕</button></td>`;
    tbody.appendChild(row);
    row.querySelector('[data-remove-row]').addEventListener('click',()=>row.remove());
  });
  document.querySelectorAll('[data-remove-row]').forEach(btn=>btn.addEventListener('click',e=>e.target.closest('tr').remove()));
  document.getElementById('save-menu-btn').addEventListener('click',()=>{
    const rows=document.querySelectorAll('#menu-edit-table tbody tr');
    const grouped={};
    rows.forEach(row=>{
      const name=row.querySelector('[data-field="name"]').value.trim();
      const duration=row.querySelector('[data-field="duration"]').value;
      const price=row.querySelector('[data-field="price"]').value;
      if(!name||!duration||!price) return;
      if(!grouped[name]) grouped[name]={};
      grouped[name][duration]=Number(price);
    });
    const newMenu=Object.entries(grouped).map(([name,durations])=>({name,durations}));
    if(!newMenu.length){showToast('Menu cannot be empty');return;}
    DB.menuOverrides[outletId]=newMenu;saveDB(DB);showToast('Menu saved');renderSettings();
  });
  document.getElementById('add-therapist-btn').addEventListener('click',()=>{
    const v=document.getElementById('new-therapist-input').value.trim();
    if(v&&!DB.therapists[outletId].includes(v)){DB.therapists[outletId].push(v);saveDB(DB);renderSettings();showToast('Therapist added');}
  });
  document.querySelectorAll('[data-remove-therapist]').forEach(btn=>btn.addEventListener('click',()=>{
    DB.therapists[outletId]=DB.therapists[outletId].filter(t=>t!==btn.dataset.removeTherapist);saveDB(DB);renderSettings();
  }));
  document.getElementById('clear-outlet-data-btn').addEventListener('click',async()=>{
    if(!await dhvConfirm(`This will permanently delete ALL entries and expenses for ${outlet.name}.\n\nThis cannot be undone.`, 'Delete', '#c0392b')) return;
    DB.deletedIds=DB.deletedIds||[];
    DB.entries.filter(e=>e.outletId===outletId).forEach(e=>{if(e.id&&!DB.deletedIds.includes(e.id))DB.deletedIds.push(e.id);});
    DB.expenses.filter(e=>e.outletId===outletId).forEach(e=>{if(e.id&&!DB.deletedIds.includes(e.id))DB.deletedIds.push(e.id);});
    DB.entries=DB.entries.filter(e=>e.outletId!==outletId);
    DB.expenses=DB.expenses.filter(e=>e.outletId!==outletId);
    saveDB(DB);showToast('Outlet data cleared');
  });
  // Outlet membership plans editor
  const outletMgid=OUTLET_MEMBERSHIP_GROUP[outletId];
  if(outletMgid&&document.getElementById('outlet-membership-gst-toggle')){
    document.getElementById('outlet-membership-gst-toggle').addEventListener('change',e=>{
      DB.membershipGstEnabled=e.target.checked;saveDB(DB);showToast('Membership GST setting updated');
    });
  }
  if(outletMgid&&document.getElementById('outlet-mp-save-btn')){
    document.getElementById('outlet-mp-add-btn').addEventListener('click',()=>{
      const tbody=document.querySelector('#outlet-mp-table tbody');
      const idx=tbody.querySelectorAll('tr').length;
      const row=document.createElement('tr');
      row.innerHTML=`<td><input data-omp-field="tier" value="New Plan" style="width:100%;min-width:110px;"></td><td><input data-omp-field="amount" type="number" value="0" style="width:100px;"></td><td><input data-omp-field="therapies" type="number" value="0" style="width:80px;"></td><td><input data-omp-field="validityMonths" type="number" value="12" style="width:80px;"></td><td><button class="del" data-omp-remove style="color:var(--rose);background:none;border:none;cursor:pointer;font-weight:700;">✕</button></td>`;
      tbody.appendChild(row);
      row.querySelector('[data-omp-remove]').addEventListener('click',()=>row.remove());
    });
    document.querySelectorAll('[data-omp-remove]').forEach(btn=>btn.addEventListener('click',()=>btn.closest('tr').remove()));
    document.getElementById('outlet-mp-save-btn').addEventListener('click',()=>{
      const rows=document.querySelectorAll('#outlet-mp-table tbody tr');
      const plans=[];
      rows.forEach(row=>{
        const tier=row.querySelector('[data-omp-field="tier"]').value.trim();
        const amount=parseFloat(row.querySelector('[data-omp-field="amount"]').value)||0;
        const therapies=parseInt(row.querySelector('[data-omp-field="therapies"]').value)||0;
        const validityMonths=parseInt(row.querySelector('[data-omp-field="validityMonths"]').value)||12;
        if(tier) plans.push({tier,amount,therapies,validityMonths});
      });
      if(!plans.length){showToast('Plans cannot be empty');return;}
      if(!DB.membershipPlans) DB.membershipPlans={};
      DB.membershipPlans[outletMgid]=plans;
      MEMBERSHIP_GROUPS[outletMgid].plans=plans;
      saveDB(DB);showToast('Membership plans saved ✓');
    });
  }
}
</script>

<div id="print-bill-area"></div>

  <div style="background:#fff;border-radius:14px;padding:28px 28px 20px;max-width:380px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.3);font-family:var(--sans);">
    <div id="dhv-confirm-msg" style="font-size:.97rem;color:#1a3a2e;line-height:1.5;margin-bottom:20px;white-space:pre-line;"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button id="dhv-confirm-cancel" style="padding:8px 18px;border-radius:8px;border:1.5px solid #ccc;background:#fff;cursor:pointer;font-size:.9rem;color:#555;">Cancel</button>
      <button id="dhv-confirm-ok" style="padding:8px 20px;border-radius:8px;border:none;background:#c0392b;color:#fff;cursor:pointer;font-size:.9rem;font-weight:600;">Delete</button>
    </div>
  </div>
</div>
